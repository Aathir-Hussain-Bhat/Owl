<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0c0a09">
<meta name="description" content="OWL — one environment for every AI model. A premium AI workspace interface layer.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OWL">
<meta name="mobile-web-app-capable" content="yes">
<title>OWL — AI Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..900&family=Geist:wght@300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
<style>
/* ============================================
   OWL — Design Tokens
   ============================================ */
:root{
  --bg: #0c0a09;
  --bg-1: #131110;
  --bg-2: #1a1715;
  --bg-3: #221e1b;
  --surface: rgba(255,240,220,0.025);
  --surface-hover: rgba(255,240,220,0.05);
  --surface-active: rgba(255,240,220,0.08);
  --border: rgba(255,240,220,0.07);
  --border-strong: rgba(255,240,220,0.14);
  --border-focus: rgba(232,176,75,0.4);
  --text: #f5efe5;
  --text-2: #c4baa8;
  --text-3: #8a8275;
  --text-4: #5c554a;
  --accent: #e8b04b;
  --accent-2: #c89233;
  --accent-soft: rgba(232,176,75,0.12);
  --accent-glow: rgba(232,176,75,0.25);
  --success: #8fb970;
  --danger: #d97757;
  --info: #7a9eb0;
  --r-lg: 16px;
  --r-md: 10px;
  --r-sm: 7px;
  --r-xs: 5px;
  --sidebar-w: 252px;
  --topbar-h: 56px;
  --composer-h: 64px;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --ease-soft: cubic-bezier(0.4, 0, 0.2, 1);
  --font-display: 'Fraunces', Georgia, serif;
  --font-ui: 'Geist', -apple-system, system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  --shadow-soft: 0 1px 2px rgba(0,0,0,0.3), 0 0 0 1px rgba(255,240,220,0.04);
  --shadow-elev: 0 8px 32px -8px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,240,220,0.06);
}

/* ============================================
   Reset & Base
   ============================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font-ui);
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  line-height:1.5;
  font-weight:400;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overflow:hidden;
  text-rendering:optimizeLegibility;
  font-feature-settings:"ss01","cv11";
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;color:inherit;background:none;border:none;outline:none}
a{color:inherit;text-decoration:none}
ul,ol{list-style:none}
img{max-width:100%;display:block}
::selection{background:var(--accent-soft);color:var(--text)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,240,220,0.08);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,240,220,0.16)}
.hidden{display:none !important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ============================================
   Splash
   ============================================ */
.splash{
  position:fixed;inset:0;
  background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:1000;
  transition:opacity 0.6s var(--ease), visibility 0.6s;
}
.splash.gone{opacity:0;visibility:hidden;pointer-events:none}
.splash-eyes{
  display:flex;gap:14px;margin-bottom:32px;
  opacity:0;transform:scale(0.85);
  animation:eyes-in 1s var(--ease) 0.2s forwards;
}
.splash-eye{
  width:28px;height:34px;border-radius:50%;
  border:1.5px solid var(--accent);
  background:radial-gradient(circle at 50% 50%, rgba(232,176,75,0.18) 0%, transparent 70%);
  position:relative;
  box-shadow:0 0 24px var(--accent-glow), inset 0 0 8px rgba(232,176,75,0.1);
}
.splash-eye::after{
  content:'';position:absolute;top:50%;left:50%;
  width:8px;height:8px;border-radius:50%;
  background:var(--accent);
  transform:translate(-50%,-50%);
  box-shadow:0 0 8px var(--accent);
  animation:pupil-blink 4s var(--ease) infinite;
}
@keyframes eyes-in{to{opacity:1;transform:scale(1)}}
@keyframes pupil-blink{
  0%,90%,100%{transform:translate(-50%,-50%) scaleY(1)}
  93%,97%{transform:translate(-50%,-50%) scaleY(0.1)}
}
.splash-wordmark{
  font-family:var(--font-display);
  font-weight:400;
  font-size:48px;
  letter-spacing:0.2em;
  font-variation-settings:"opsz" 144;
  opacity:0;
  animation:fade-up 0.8s var(--ease) 0.8s forwards;
}
.splash-tagline{
  margin-top:14px;
  font-size:12px;
  color:var(--text-3);
  letter-spacing:0.15em;
  text-transform:uppercase;
  opacity:0;
  animation:fade-up 0.8s var(--ease) 1.1s forwards;
}
@keyframes fade-up{
  from{opacity:0;transform:translateY(6px)}
  to{opacity:1;transform:translateY(0)}
}

/* ============================================
   Onboarding
   ============================================ */
.onboarding{
  position:fixed;inset:0;
  background:var(--bg);
  display:flex;flex-direction:column;
  z-index:900;
}
.onboarding::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 80% 50% at 50% 0%, rgba(232,176,75,0.05), transparent 70%);
  pointer-events:none;
}
.ob-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:22px 32px;
  position:relative;z-index:1;
}
.ob-logo{
  display:flex;align-items:center;gap:10px;
  font-family:var(--font-display);
  font-size:18px;letter-spacing:0.15em;
  font-weight:400;
}
.ob-logo .splash-eyes{transform:scale(0.45);margin:0;gap:8px;opacity:1;animation:none}
.ob-logo .splash-eye{width:20px;height:24px}
.ob-logo .splash-eye::after{width:5px;height:5px}
.ob-step-count{
  font-size:12px;color:var(--text-3);letter-spacing:0.08em;
  font-variant-numeric:tabular-nums;
}
.ob-skip{
  font-size:13px;color:var(--text-3);padding:6px 12px;border-radius:6px;
  transition:color 0.2s, background 0.2s;
}
.ob-skip:hover{color:var(--text);background:var(--surface-hover)}
.ob-body{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:40px 24px;
  position:relative;z-index:1;
  overflow-y:auto;
}
.ob-content{max-width:780px;width:100%;text-align:center}
.ob-eyebrow{
  font-size:11px;letter-spacing:0.2em;text-transform:uppercase;
  color:var(--accent);margin-bottom:18px;
  opacity:0;animation:fade-up 0.6s var(--ease) forwards;
}
.ob-title{
  font-family:var(--font-display);
  font-size:clamp(32px, 5vw, 44px);
  font-weight:400;line-height:1.15;letter-spacing:-0.01em;
  font-variation-settings:"opsz" 144;
  color:var(--text);
  margin-bottom:14px;
  opacity:0;animation:fade-up 0.6s var(--ease) 0.1s forwards;
}
.ob-title em{font-style:italic;color:var(--accent);font-variation-settings:"opsz" 144}
.ob-subtitle{
  font-size:15px;color:var(--text-3);max-width:520px;margin:0 auto 40px;
  line-height:1.6;
  opacity:0;animation:fade-up 0.6s var(--ease) 0.2s forwards;
}
.ob-actions{
  display:flex;gap:12px;justify-content:center;margin-top:36px;
  opacity:0;animation:fade-up 0.6s var(--ease) 0.3s forwards;
}

/* Provider Grid */
.provider-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
  gap:12px;
  margin-top:8px;
  text-align:left;
}
.provider-card{
  background:var(--bg-1);
  border:1px solid var(--border);
  border-radius:var(--r-md);
  padding:18px 18px 16px;
  cursor:pointer;
  transition:all 0.25s var(--ease);
  position:relative;
  overflow:hidden;
}
.provider-card::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg, transparent 60%, var(--provider-color, var(--accent)) 200%);
  opacity:0;transition:opacity 0.3s;
  pointer-events:none;
}
.provider-card:hover{
  border-color:var(--border-strong);
  background:var(--bg-2);
  transform:translateY(-2px);
}
.provider-card:hover::before{opacity:0.08}
.provider-card.selected{
  border-color:var(--provider-color, var(--accent));
  background:var(--bg-2);
}
.provider-card.selected::before{opacity:0.12}
.provider-card.selected::after{
  content:'';position:absolute;top:14px;right:14px;
  width:8px;height:8px;border-radius:50%;
  background:var(--provider-color, var(--accent));
  box-shadow:0 0 12px var(--provider-color, var(--accent));
}
.provider-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.provider-glyph{
  width:34px;height:34px;border-radius:8px;
  background:var(--provider-color, var(--accent));
  display:flex;align-items:center;justify-content:center;
  font-weight:600;font-size:15px;color:#0c0a09;
  font-family:var(--font-display);
  flex-shrink:0;
}
.provider-name{font-size:14px;font-weight:500;color:var(--text)}
.provider-product{font-size:12px;color:var(--text-3);margin-top:1px}
.provider-desc{font-size:12.5px;color:var(--text-2);line-height:1.45;margin-top:4px}
.provider-auth{
  font-size:11px;color:var(--text-4);
  margin-top:12px;padding-top:10px;
  border-top:1px solid var(--border);
  letter-spacing:0.04em;
}

/* Auth step */
.auth-panel{
  background:var(--bg-1);
  border:1px solid var(--border);
  border-radius:var(--r-lg);
  padding:32px;
  max-width:480px;
  margin:0 auto;
  text-align:left;
}
.auth-provider-head{
  display:flex;align-items:center;gap:14px;
  margin-bottom:24px;
  padding-bottom:20px;
  border-bottom:1px solid var(--border);
}
.auth-provider-head .provider-glyph{width:42px;height:42px;font-size:18px;border-radius:10px}
.auth-steps{display:flex;flex-direction:column;gap:14px;margin:24px 0}
.auth-step{
  display:flex;gap:12px;align-items:flex-start;
  font-size:13px;color:var(--text-2);line-height:1.5;
}
.auth-step-num{
  width:22px;height:22px;border-radius:50%;
  background:var(--surface);border:1px solid var(--border-strong);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:500;color:var(--text-2);
  flex-shrink:0;
}
.auth-note{
  font-size:12px;color:var(--text-3);
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r-sm);
  padding:12px 14px;
  margin-top:20px;
  line-height:1.5;
}
.auth-note strong{color:var(--text-2);font-weight:500}

.auth-progress{
  display:flex;flex-direction:column;align-items:center;gap:18px;
  padding:24px 0;
}
.auth-spinner{
  width:36px;height:36px;
  border:2px solid var(--border);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin 0.9s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.auth-progress-text{font-size:13px;color:var(--text-2)}

.connection-confirmed{
  display:flex;flex-direction:column;align-items:center;gap:18px;
  padding:24px 0;
}
.confirm-badge{
  width:60px;height:60px;border-radius:50%;
  background:rgba(143,185,112,0.12);
  border:1.5px solid var(--success);
  display:flex;align-items:center;justify-content:center;
  animation:badge-pop 0.6s var(--ease);
}
@keyframes badge-pop{
  0%{transform:scale(0.5);opacity:0}
  60%{transform:scale(1.1)}
  100%{transform:scale(1);opacity:1}
}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 18px;
  font-size:13.5px;font-weight:500;
  border-radius:var(--r-sm);
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text);
  transition:all 0.2s var(--ease);
  white-space:nowrap;
  letter-spacing:-0.005em;
}
.btn:hover{background:var(--surface-hover);border-color:var(--border-strong)}
.btn:active{transform:scale(0.98)}
.btn-primary{
  background:var(--accent);color:#1a1308;border-color:var(--accent);
  font-weight:500;
}
.btn-primary:hover{
  background:var(--accent-2);border-color:var(--accent-2);
  box-shadow:0 0 24px var(--accent-glow);
}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:var(--surface-hover)}
.btn-lg{padding:12px 22px;font-size:14px}
.btn-icon{padding:8px;border-radius:6px}
.btn-icon svg{width:16px;height:16px}
.btn:disabled{opacity:0.4;cursor:not-allowed;transform:none}

/* ============================================
   App Shell
   ============================================ */
.app{
  display:grid;
  grid-template-columns:var(--sidebar-w) 1fr;
  grid-template-rows:100dvh;
  height:100dvh;
  background:var(--bg);
  position:relative;
}
.app.no-sidebar{grid-template-columns:1fr}

/* Sidebar */
.sidebar{
  display:flex;flex-direction:column;
  background:var(--bg-1);
  border-right:1px solid var(--border);
  overflow:hidden;
}
.sb-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px 14px 18px;
  height:var(--topbar-h);
  flex-shrink:0;
}
.sb-logo{
  display:flex;align-items:center;gap:8px;
  font-family:var(--font-display);
  font-size:16px;letter-spacing:0.18em;
  font-weight:400;
}
.sb-logo-mark{
  display:flex;gap:3px;
}
.sb-logo-mark .splash-eye{width:11px;height:13px;border-width:1px}
.sb-logo-mark .splash-eye::after{width:3px;height:3px;box-shadow:none}
.sb-collapse{
  width:26px;height:26px;
  display:flex;align-items:center;justify-content:center;
  border-radius:6px;color:var(--text-3);
  transition:color 0.2s, background 0.2s;
}
.sb-collapse:hover{color:var(--text);background:var(--surface-hover)}
.sb-collapse svg{width:14px;height:14px}

.sb-new{
  margin:4px 12px 8px;
  padding:9px 12px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r-sm);
  font-size:13px;font-weight:500;
  transition:all 0.2s var(--ease);
}
.sb-new:hover{background:var(--surface-hover);border-color:var(--border-strong)}
.sb-new-kbd{
  font-family:var(--font-mono);
  font-size:10.5px;
  color:var(--text-3);
  background:rgba(255,240,220,0.04);
  padding:2px 5px;border-radius:3px;
  border:1px solid var(--border);
}

.sb-search{
  margin:0 12px 8px;
  position:relative;
}
.sb-search input{
  width:100%;
  padding:8px 12px 8px 30px;
  font-size:13px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r-sm);
  transition:border-color 0.2s, background 0.2s;
}
.sb-search input::placeholder{color:var(--text-4)}
.sb-search input:focus{background:var(--bg-2);border-color:var(--border-strong)}
.sb-search svg{
  position:absolute;left:9px;top:50%;transform:translateY(-50%);
  width:13px;height:13px;color:var(--text-3);pointer-events:none;
}

.sb-nav{
  padding:6px 8px 8px;
  display:flex;flex-direction:column;gap:1px;
}
.sb-nav-item{
  display:flex;align-items:center;gap:10px;
  padding:7px 10px;
  font-size:13px;
  color:var(--text-2);
  border-radius:var(--r-xs);
  transition:all 0.15s var(--ease);
  cursor:pointer;
  position:relative;
}
.sb-nav-item:hover{background:var(--surface-hover);color:var(--text)}
.sb-nav-item.active{background:var(--surface-active);color:var(--text)}
.sb-nav-item.active::before{
  content:'';position:absolute;left:-8px;top:50%;transform:translateY(-50%);
  width:2px;height:16px;background:var(--accent);border-radius:0 2px 2px 0;
}
.sb-nav-item svg{width:15px;height:15px;flex-shrink:0;opacity:0.85}
.sb-nav-item .count{
  margin-left:auto;font-size:11px;color:var(--text-4);
  font-variant-numeric:tabular-nums;
}

.sb-section-label{
  padding:14px 18px 6px;
  font-size:10.5px;letter-spacing:0.12em;text-transform:uppercase;
  color:var(--text-4);
  display:flex;align-items:center;justify-content:space-between;
}
.sb-recent{
  flex:1;overflow-y:auto;
  padding:0 8px 8px;
}
.recent-item{
  padding:7px 10px;
  border-radius:var(--r-xs);
  cursor:pointer;
  transition:background 0.15s;
  display:flex;flex-direction:column;gap:1px;
  position:relative;
}
.recent-item:hover{background:var(--surface-hover)}
.recent-item.active{background:var(--surface-active)}
.recent-item .ri-title{
  font-size:12.5px;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-weight:400;
}
.recent-item .ri-meta{
  display:flex;align-items:center;gap:6px;
  font-size:11px;color:var(--text-4);
}
.recent-item .ri-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--provider-color, var(--text-4));
  flex-shrink:0;
}
.recent-item .ri-del{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:20px;height:20px;
  display:flex;align-items:center;justify-content:center;
  border-radius:4px;color:var(--text-3);opacity:0;
  transition:opacity 0.15s, background 0.15s, color 0.15s;
}
.recent-item:hover .ri-del{opacity:1}
.recent-item .ri-del:hover{background:var(--surface-active);color:var(--danger)}

.sb-footer{
  border-top:1px solid var(--border);
  padding:10px 12px;
  flex-shrink:0;
}
.sb-provider{
  display:flex;align-items:center;gap:10px;
  padding:7px 8px;
  border-radius:var(--r-xs);
  cursor:pointer;
  transition:background 0.15s;
}
.sb-provider:hover{background:var(--surface-hover)}
.sb-provider-avatar{
  width:26px;height:26px;border-radius:6px;
  background:var(--provider-color, var(--accent));
  display:flex;align-items:center;justify-content:center;
  font-weight:600;font-size:12px;color:#0c0a09;
  font-family:var(--font-display);
  flex-shrink:0;
  position:relative;
}
.sb-provider-avatar::after{
  content:'';position:absolute;bottom:-1px;right:-1px;
  width:7px;height:7px;border-radius:50%;
  background:var(--success);border:1.5px solid var(--bg-1);
}
.sb-provider-info{flex:1;min-width:0}
.sb-provider-name{font-size:12.5px;color:var(--text);font-weight:500}
.sb-provider-model{font-size:11px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ============================================
   Workspace
   ============================================ */
.workspace{
  display:flex;flex-direction:column;
  height:100dvh;
  overflow:hidden;
  position:relative;
  background:var(--bg);
}
.ws-topbar{
  height:var(--topbar-h);
  flex-shrink:0;
  display:flex;align-items:center;gap:10px;
  padding:0 18px;
  border-bottom:1px solid var(--border);
  background:rgba(12,10,9,0.8);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  z-index:10;
}
.tb-mobile-menu{
  display:none;
  width:34px;height:34px;
  align-items:center;justify-content:center;
  border-radius:6px;color:var(--text-2);
}
.tb-title{
  display:flex;align-items:center;gap:10px;
  flex:1;min-width:0;
}
.tb-title-text{
  font-size:14px;font-weight:500;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tb-breadcrumb{font-size:12px;color:var(--text-3);display:flex;align-items:center;gap:6px}
.tb-breadcrumb svg{width:11px;height:11px}
.tb-model-pill{
  display:flex;align-items:center;gap:7px;
  padding:5px 10px 5px 8px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  font-size:12px;
  cursor:pointer;
  transition:all 0.2s var(--ease);
}
.tb-model-pill:hover{background:var(--surface-hover);border-color:var(--border-strong)}
.tb-model-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--provider-color, var(--accent))}
.tb-model-pill .name{color:var(--text-2)}
.tb-model-pill svg{width:11px;height:11px;color:var(--text-3);margin-left:2px}
.tb-actions{display:flex;align-items:center;gap:4px}
.tb-action{
  width:32px;height:32px;
  display:flex;align-items:center;justify-content:center;
  border-radius:6px;color:var(--text-3);
  transition:all 0.15s;
}
.tb-action:hover{background:var(--surface-hover);color:var(--text)}
.tb-action svg{width:15px;height:15px}

.ws-content{
  flex:1;
  overflow-y:auto;
  position:relative;
  scroll-behavior:smooth;
}
.ws-content::-webkit-scrollbar{width:10px}

/* ============================================
   Chat View
   ============================================ */
.chat-view{padding:0 0 120px}

.chat-empty{
  display:flex;flex-direction:column;align-items:center;
  padding:80px 24px 40px;
  text-align:center;
  max-width:680px;margin:0 auto;
}
.chat-empty-icon{
  display:flex;gap:6px;margin-bottom:28px;
}
.chat-empty-icon .splash-eye{
  width:32px;height:38px;border-width:1.5px;
}
.chat-empty h1{
  font-family:var(--font-display);
  font-size:clamp(28px, 4vw, 38px);
  font-weight:300;
  line-height:1.2;letter-spacing:-0.02em;
  font-variation-settings:"opsz" 144;
  margin-bottom:12px;
  color:var(--text);
}
.chat-empty h1 em{font-style:italic;color:var(--accent)}
.chat-empty p{
  font-size:14.5px;color:var(--text-3);line-height:1.6;
  max-width:440px;margin:0 auto 36px;
}
.chat-suggestions{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:10px;width:100%;max-width:580px;
}
.suggestion{
  text-align:left;
  padding:14px 16px;
  background:var(--bg-1);
  border:1px solid var(--border);
  border-radius:var(--r-md);
  cursor:pointer;
  transition:all 0.2s var(--ease);
}
.suggestion:hover{
  background:var(--bg-2);
  border-color:var(--border-strong);
  transform:translateY(-1px);
}
.suggestion-title{font-size:13px;color:var(--text);font-weight:500;margin-bottom:3px}
.suggestion-desc{font-size:12px;color:var(--text-3);line-height:1.4}

/* Messages */
.messages{max-width:760px;margin:0 auto;padding:24px 24px 0}
.msg{
  padding:14px 0 18px;
  border-bottom:1px solid var(--border);
  animation:msg-in 0.4s var(--ease);
}
@keyframes msg-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg:last-child{border-bottom:none}
.msg-head{
  display:flex;align-items:center;gap:10px;
  margin-bottom:8px;
  font-size:12.5px;
}
.msg-avatar{
  width:22px;height:22px;border-radius:5px;
  display:flex;align-items:center;justify-content:center;
  font-weight:600;font-size:10px;color:#0c0a09;
  font-family:var(--font-display);
  flex-shrink:0;
}
.msg-avatar.user{background:var(--text-3);color:var(--bg)}
.msg-avatar.ai{background:var(--provider-color, var(--accent))}
.msg-author{font-weight:500;color:var(--text)}
.msg-meta{color:var(--text-4);font-size:11.5px;display:flex;align-items:center;gap:6px}
.msg-meta .sep{color:var(--text-4);opacity:0.5}
.msg-meta .provider-tag{
  display:flex;align-items:center;gap:4px;
  color:var(--text-3);
}
.msg-meta .provider-tag .dot{width:5px;height:5px;border-radius:50%;background:var(--provider-color,var(--accent))}
.msg-body{
  font-size:14.5px;line-height:1.65;color:var(--text);
  word-wrap:break-word;
}
.msg-body.user-body{
  background:var(--surface);
  padding:11px 14px;border-radius:var(--r-md);
  border:1px solid var(--border);
  display:inline-block;max-width:100%;
}
.msg-body p{margin:0 0 12px}
.msg-body p:last-child{margin-bottom:0}
.msg-body h1,.msg-body h2,.msg-body h3{
  font-family:var(--font-display);
  font-weight:400;
  margin:18px 0 10px;
  line-height:1.3;
  font-variation-settings:"opsz" 36;
  letter-spacing:-0.01em;
}
.msg-body h1{font-size:22px}
.msg-body h2{font-size:18px}
.msg-body h3{font-size:15.5px;color:var(--text-2)}
.msg-body ul,.msg-body ol{margin:8px 0 12px;padding-left:22px}
.msg-body li{margin-bottom:4px}
.msg-body ul li::marker{color:var(--accent)}
.msg-body ol li::marker{color:var(--text-3)}
.msg-body strong{color:var(--text);font-weight:600}
.msg-body em{font-style:italic;color:var(--text-2)}
.msg-body a{color:var(--accent);text-decoration:underline;text-decoration-color:rgba(232,176,75,0.3);text-underline-offset:2px}
.msg-body a:hover{text-decoration-color:var(--accent)}
.msg-body blockquote{
  border-left:2px solid var(--accent);
  padding:4px 0 4px 14px;
  margin:10px 0;
  color:var(--text-2);font-style:italic;
}
.msg-body code:not(pre code){
  font-family:var(--font-mono);font-size:12.5px;
  background:var(--bg-2);
  padding:2px 6px;border-radius:4px;
  color:var(--accent);
  border:1px solid var(--border);
}
.msg-body pre{
  margin:12px 0;
  border-radius:var(--r-md);
  overflow:hidden;
  background:#0e0c0b;
  border:1px solid var(--border);
}
.msg-body pre .code-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 12px;
  background:rgba(255,240,220,0.02);
  border-bottom:1px solid var(--border);
  font-size:11px;color:var(--text-3);
  font-family:var(--font-mono);
  letter-spacing:0.04em;
}
.msg-body pre .code-copy{
  display:flex;align-items:center;gap:5px;
  padding:3px 8px;border-radius:4px;
  color:var(--text-3);cursor:pointer;
  transition:all 0.15s;
}
.msg-body pre .code-copy:hover{background:var(--surface-hover);color:var(--text)}
.msg-body pre .code-copy svg{width:11px;height:11px}
.msg-body pre code{
  display:block;
  padding:14px 16px;
  font-family:var(--font-mono);font-size:12.5px;
  line-height:1.55;
  overflow-x:auto;
  color:#d4cec4;
}
.msg-body table{
  width:100%;border-collapse:collapse;margin:12px 0;
  font-size:13px;
}
.msg-body th,.msg-body td{
  padding:8px 12px;border:1px solid var(--border);text-align:left;
}
.msg-body th{background:var(--bg-2);font-weight:500;color:var(--text-2)}
.msg-body hr{border:none;border-top:1px solid var(--border);margin:18px 0}
.msg-body .streaming-cursor{
  display:inline-block;width:7px;height:14px;
  background:var(--accent);margin-left:2px;
  vertical-align:text-bottom;
  animation:cursor-blink 1s steps(2) infinite;
}
@keyframes cursor-blink{50%{opacity:0}}

.msg-actions{
  display:flex;gap:2px;
  margin-top:10px;
  opacity:0;transition:opacity 0.2s;
}
.msg:hover .msg-actions{opacity:1}
.msg-action{
  display:flex;align-items:center;gap:5px;
  padding:5px 8px;
  font-size:11.5px;color:var(--text-3);
  border-radius:5px;
  transition:all 0.15s;
}
.msg-action:hover{background:var(--surface-hover);color:var(--text)}
.msg-action svg{width:12px;height:12px}

/* Attachments in messages */
.msg-attachments{
  display:flex;flex-wrap:wrap;gap:6px;
  margin-bottom:10px;
}
.msg-attach{
  display:flex;align-items:center;gap:7px;
  padding:5px 9px;
  background:var(--bg-2);
  border:1px solid var(--border);
  border-radius:var(--r-xs);
  font-size:11.5px;color:var(--text-2);
}
.msg-attach svg{width:12px;height:12px;color:var(--text-3)}

/* ============================================
   Composer
   ============================================ */
.composer-wrap{
  position:relative;
  flex-shrink:0;
}
.composer{
  max-width:760px;
  margin:0 auto;
  padding:12px 24px 16px;
  position:relative;
}
.composer.attachments-present{padding-top:6px}
.composer-attachments{
  display:flex;flex-wrap:wrap;gap:6px;
  margin-bottom:8px;
}
.composer-attach{
  display:flex;align-items:center;gap:6px;
  padding:5px 8px 5px 8px;
  background:var(--bg-2);
  border:1px solid var(--border);
  border-radius:var(--r-xs);
  font-size:11.5px;color:var(--text-2);
}
.composer-attach .ca-remove{
  width:14px;height:14px;
  display:flex;align-items:center;justify-content:center;
  border-radius:3px;color:var(--text-3);
  cursor:pointer;
}
.composer-attach .ca-remove:hover{color:var(--danger)}
.composer-attach .ca-remove svg{width:9px;height:9px}

.composer-box{
  background:var(--bg-1);
  border:1px solid var(--border);
  border-radius:var(--r-md);
  transition:border-color 0.2s, box-shadow 0.2s;
  position:relative;
}
.composer-box:focus-within{
  border-color:var(--border-focus);
  box-shadow:0 0 0 3px rgba(232,176,75,0.08);
}
.composer-row{
  display:flex;align-items:flex-end;gap:8px;
  padding:8px 8px 8px 10px;
}
.composer-plus{
  width:32px;height:32px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  border-radius:6px;color:var(--text-3);
  transition:all 0.15s;
  cursor:pointer;
  position:relative;
}
.composer-plus:hover{background:var(--surface-hover);color:var(--text)}
.composer-plus svg{width:18px;height:18px}
.composer-input{
  flex:1;
  font-size:14.5px;
  line-height:1.5;
  padding:6px 4px;
  max-height:200px;
  overflow-y:auto;
  color:var(--text);
  font-family:var(--font-ui);
  resize:none;
}
.composer-input::placeholder{color:var(--text-4)}
.composer-send{
  width:32px;height:32px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  border-radius:6px;
  background:var(--accent);color:#1a1308;
  transition:all 0.2s var(--ease);
}
.composer-send:hover{background:var(--accent-2);box-shadow:0 0 16px var(--accent-glow)}
.composer-send:disabled{
  background:var(--surface);color:var(--text-4);
  cursor:not-allowed;box-shadow:none;
}
.composer-send svg{width:15px;height:15px}
.composer-send.stop{background:var(--danger);color:white}
.composer-send.stop:hover{background:#c46642}

.composer-attach-menu{
  position:absolute;
  bottom:calc(100% + 8px);
  left:24px;
  background:var(--bg-2);
  border:1px solid var(--border-strong);
  border-radius:var(--r-md);
  padding:6px;
  box-shadow:var(--shadow-elev);
  min-width:200px;
  z-index:50;
  opacity:0;transform:translateY(6px) scale(0.96);
  pointer-events:none;
  transition:opacity 0.2s, transform 0.2s;
}
.composer-attach-menu.open{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.attach-menu-item{
  display:flex;align-items:center;gap:10px;
  padding:8px 10px;
  border-radius:var(--r-xs);
  font-size:13px;color:var(--text-2);
  cursor:pointer;
  transition:background 0.15s;
}
.attach-menu-item:hover{background:var(--surface-hover);color:var(--text)}
.attach-menu-item svg{width:14px;height:14px;color:var(--text-3)}
.attach-menu-item .ami-desc{font-size:11px;color:var(--text-4);margin-top:1px}

.composer-hint{
  font-size:11px;color:var(--text-4);
  text-align:center;
  margin-top:8px;
  font-variant-numeric:tabular-nums;
}
.composer-hint kbd{
  font-family:var(--font-mono);font-size:10px;
  padding:1px 4px;border-radius:3px;
  background:var(--surface);border:1px solid var(--border);
}

/* ============================================
   Views (Home, Projects, Models, Files, Settings)
   ============================================ */
.view{padding:32px 24px 80px;max-width:980px;margin:0 auto}
.view-head{margin-bottom:24px}
.view-eyebrow{
  font-size:11px;letter-spacing:0.15em;text-transform:uppercase;
  color:var(--accent);margin-bottom:10px;
}
.view-title{
  font-family:var(--font-display);
  font-size:30px;font-weight:300;
  letter-spacing:-0.015em;line-height:1.2;
  font-variation-settings:"opsz" 144;
  color:var(--text);
  margin-bottom:6px;
}
.view-subtitle{font-size:13.5px;color:var(--text-3);line-height:1.5}

/* Home view */
.home-greeting{
  font-family:var(--font-display);
  font-size:clamp(28px, 4vw, 36px);
  font-weight:300;line-height:1.2;letter-spacing:-0.015em;
  font-variation-settings:"opsz" 144;
  margin-bottom:6px;
}
.home-greeting em{font-style:italic;color:var(--accent)}
.home-date{font-size:13px;color:var(--text-3);margin-bottom:32px}

.home-section{margin-bottom:36px}
.home-section-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:14px;
}
.home-section-title{
  font-size:12px;letter-spacing:0.12em;text-transform:uppercase;
  color:var(--text-3);
}
.home-section-action{
  font-size:12px;color:var(--text-3);
  display:flex;align-items:center;gap:4px;
  padding:4px 8px;border-radius:5px;
  cursor:pointer;transition:all 0.15s;
}
.home-section-action:hover{color:var(--text);background:var(--surface-hover)}

.home-quick{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));
  gap:10px;
}
.quick-card{
  padding:16px;
  background:var(--bg-1);
  border:1px solid var(--border);
  border-radius:var(--r-md);
  cursor:pointer;
  transition:all 0.2s var(--ease);
}
.quick-card:hover{
  background:var(--bg-2);border-color:var(--border-strong);
  transform:translateY(-1px);
}
.quick-card-icon{
  width:30px;height:30px;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:10px;
  color:var(--accent);
}
.quick-card-icon svg{width:18px;height:18px}
.quick-card-title{font-size:13px;font-weight:500;color:var(--text);margin-bottom:3px}
.quick-card-desc{font-size:12px;color:var(--text-3);line-height:1.4}

.home-recent-list{display:flex;flex-direction:column;gap:2px}
.home-recent-item{
  display:flex;align-items:center;gap:12px;
  padding:10px 12px;
  border-radius:var(--r-sm);
  cursor:pointer;transition:background 0.15s;
}
.home-recent-item:hover{background:var(--surface-hover)}
.home-recent-item .dot{width:7px;height:7px;border-radius:50%;background:var(--provider-color,var(--text-4));flex-shrink:0}
.home-recent-item .title{font-size:13px;color:var(--text);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.home-recent-item .time{font-size:11.5px;color:var(--text-4);font-variant-numeric:tabular-nums}

/* Projects view */
.projects-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
  gap:12px;
}
.project-card{
  padding:18px;
  background:var(--bg-1);
  border:1px solid var(--border);
  border-radius:var(--r-md);
  cursor:pointer;
  transition:all 0.2s var(--ease);
  position:relative;
}
.project-card:hover{border-color:var(--border-strong);background:var(--bg-2);transform:translateY(-1px)}
.project-card-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.project-icon{
  width:30px;height:30px;border-radius:7px;
  background:var(--surface);
  border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  color:var(--accent);
}
.project-icon svg{width:14px;height:14px}
.project-name{font-size:14px;font-weight:500;color:var(--text)}
.project-desc{font-size:12.5px;color:var(--text-3);line-height:1.5;margin-bottom:14px;min-height:36px}
.project-meta{display:flex;gap:14px;font-size:11.5px;color:var(--text-4)}
.project-meta-item{display:flex;align-items:center;gap:4px}
.project-meta-item svg{width:11px;height:11px}

.project-new{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:18px;
  background:transparent;
  border:1px dashed var(--border-strong);
  border-radius:var(--r-md);
  cursor:pointer;
  transition:all 0.2s;
  min-height:130px;
  color:var(--text-3);
  gap:8px;
}
.project-new:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.project-new svg{width:18px;height:18px}
.project-new span{font-size:13px;font-weight:500}

/* Models view */
.models-section{margin-bottom:32px}
.models-section-title{
  font-size:13px;font-weight:500;color:var(--text-2);
  margin-bottom:12px;
  display:flex;align-items:center;gap:8px;
}
.models-section-title .dot{width:8px;height:8px;border-radius:50%}
.models-list{display:flex;flex-direction:column;gap:6px}
.model-row{
  display:flex;align-items:center;gap:14px;
  padding:14px 16px;
  background:var(--bg-1);
  border:1px solid var(--border);
  border-radius:var(--r-md);
  transition:all 0.2s;
}
.model-row:hover{background:var(--bg-2);border-color:var(--border-strong)}
.model-row.active{
  border-color:var(--provider-color, var(--accent));
  background:var(--bg-2);
}
.model-row.active::before{
  content:'';width:3px;height:24px;
  background:var(--provider-color, var(--accent));
  border-radius:2px;
  margin-right:-4px;
}
.model-info{flex:1;min-width:0}
.model-name{font-size:13.5px;font-weight:500;color:var(--text);margin-bottom:2px}
.model-desc{font-size:12px;color:var(--text-3);line-height:1.4}
.model-caps{display:flex;gap:5px;flex-wrap:wrap}
.cap-tag{
  font-size:10.5px;
  padding:3px 7px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  color:var(--text-3);
  letter-spacing:0.02em;
}
.cap-tag.supported{color:var(--success);border-color:rgba(143,185,112,0.2)}
.cap-tag.unsupported{color:var(--text-4);opacity:0.5}
.model-select{
  padding:6px 12px;
  font-size:12px;font-weight:500;
  background:var(--accent);color:#1a1308;
  border-radius:5px;
  transition:all 0.15s;
}
.model-select:hover{background:var(--accent-2)}
.model-select.selected{background:var(--surface);color:var(--text-2);cursor:default}
.model-select.selected::before{content:'✓ ';}

/* Files view */
.files-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));
  gap:10px;
}
.file-card{
  padding:14px;
  background:var(--bg-1);
  border:1px solid var(--border);
  border-radius:var(--r-md);
  cursor:pointer;
  transition:all 0.2s;
  display:flex;flex-direction:column;gap:8px;
}
.file-card:hover{background:var(--bg-2);border-color:var(--border-strong)}
.file-icon{
  width:36px;height:36px;border-radius:8px;
  background:var(--surface);
  display:flex;align-items:center;justify-content:center;
  color:var(--text-2);
}
.file-icon svg{width:18px;height:18px}
.file-name{font-size:12.5px;color:var(--text);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-meta{font-size:11px;color:var(--text-4)}

.file-drop{
  border:1.5px dashed var(--border-strong);
  border-radius:var(--r-md);
  padding:36px 24px;
  text-align:center;
  margin-bottom:20px;
  transition:all 0.2s;
  cursor:pointer;
}
.file-drop.drag-over{border-color:var(--accent);background:var(--accent-soft)}
.file-drop-icon{
  width:36px;height:36px;margin:0 auto 12px;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-3);
}
.file-drop-icon svg{width:24px;height:24px}
.file-drop-text{font-size:13px;color:var(--text-2);margin-bottom:4px}
.file-drop-hint{font-size:11.5px;color:var(--text-4)}

/* Settings view */
.settings-section{margin-bottom:28px}
.settings-section-title{
  font-size:11px;letter-spacing:0.12em;text-transform:uppercase;
  color:var(--text-4);margin-bottom:10px;
  padding-bottom:8px;border-bottom:1px solid var(--border);
}
.settings-list{
  background:var(--bg-1);
  border:1px solid var(--border);
  border-radius:var(--r-md);
  overflow:hidden;
}
.setting-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 16px;
  border-bottom:1px solid var(--border);
  gap:16px;
}
.setting-row:last-child{border-bottom:none}
.setting-info{flex:1;min-width:0}
.setting-label{font-size:13px;color:var(--text);font-weight:500;margin-bottom:2px}
.setting-desc{font-size:12px;color:var(--text-3);line-height:1.4}

.toggle{
  position:relative;
  width:36px;height:20px;
  background:var(--bg-3);
  border-radius:10px;
  cursor:pointer;
  transition:background 0.2s;
  flex-shrink:0;
}
.toggle::after{
  content:'';position:absolute;
  top:2px;left:2px;
  width:16px;height:16px;border-radius:50%;
  background:var(--text-2);
  transition:transform 0.2s var(--ease), background 0.2s;
}
.toggle.on{background:var(--accent)}
.toggle.on::after{transform:translateX(16px);background:#1a1308}

.select-pill{
  display:flex;gap:2px;
  background:var(--bg-3);
  padding:2px;border-radius:6px;
}
.select-pill button{
  padding:4px 10px;
  font-size:12px;color:var(--text-3);
  border-radius:4px;
  transition:all 0.15s;
}
.select-pill button.active{background:var(--surface-active);color:var(--text)}

.setting-action{
  font-size:12.5px;font-weight:500;
  padding:6px 12px;
  border-radius:5px;
  border:1px solid var(--border-strong);
  color:var(--text-2);
  transition:all 0.15s;
}
.setting-action:hover{background:var(--surface-hover);color:var(--text)}
.setting-action.danger{color:var(--danger);border-color:rgba(217,119,87,0.3)}
.setting-action.danger:hover{background:rgba(217,119,87,0.1)}

.provider-setting{
  display:flex;align-items:center;gap:12px;
  padding:13px 16px;
}
.provider-setting .ps-info{flex:1}
.provider-setting .ps-name{font-size:13px;font-weight:500;color:var(--text)}
.provider-setting .ps-status{font-size:11.5px;color:var(--success);margin-top:2px;display:flex;align-items:center;gap:5px}
.provider-setting .ps-status .dot{width:6px;height:6px;border-radius:50%;background:var(--success)}

/* ============================================
   Bottom Nav (mobile)
   ============================================ */
.bottom-nav{
  display:none;
  height:54px;
  border-top:1px solid var(--border);
  background:rgba(12,10,9,0.95);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  align-items:center;
  padding:0 4px;
  flex-shrink:0;
  position:relative;
  z-index:20;
}
.bn-item{
  flex:1;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 2px;
  font-size:10px;color:var(--text-4);
  border-radius:6px;
  transition:color 0.15s;
}
.bn-item svg{width:19px;height:19px}
.bn-item.active{color:var(--accent)}
.bn-item:active{transform:scale(0.92)}

/* ============================================
   Toast
   ============================================ */
.toast-container{
  position:fixed;
  bottom:24px;left:50%;transform:translateX(-50%);
  z-index:2000;
  display:flex;flex-direction:column;gap:8px;
  pointer-events:none;
}
.toast{
  background:var(--bg-2);
  border:1px solid var(--border-strong);
  border-radius:var(--r-sm);
  padding:10px 14px;
  font-size:13px;color:var(--text);
  box-shadow:var(--shadow-elev);
  pointer-events:auto;
  display:flex;align-items:center;gap:8px;
  animation:toast-in 0.3s var(--ease);
}
.toast.success{border-color:rgba(143,185,112,0.3)}
.toast.success .toast-icon{color:var(--success)}
.toast.error{border-color:rgba(217,119,87,0.3)}
.toast.error .toast-icon{color:var(--danger)}
.toast-icon svg{width:14px;height:14px}
@keyframes toast-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes toast-out{to{opacity:0;transform:translateY(8px)}}

/* ============================================
   Modal
   ============================================ */
.modal-backdrop{
  position:fixed;inset:0;
  background:rgba(8,7,6,0.7);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  z-index:1500;
  display:flex;align-items:center;justify-content:center;
  padding:24px;
  animation:fade-in 0.2s var(--ease);
}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--bg-1);
  border:1px solid var(--border-strong);
  border-radius:var(--r-lg);
  width:100%;max-width:440px;
  max-height:80vh;
  overflow-y:auto;
  box-shadow:var(--shadow-elev);
  animation:modal-in 0.25s var(--ease);
}
@keyframes modal-in{from{opacity:0;transform:scale(0.96) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-head{
  padding:18px 20px 12px;
  display:flex;align-items:center;justify-content:space-between;
}
.modal-title{font-family:var(--font-display);font-size:18px;font-weight:400;font-variation-settings:"opsz" 36}
.modal-close{
  width:28px;height:28px;
  display:flex;align-items:center;justify-content:center;
  border-radius:5px;color:var(--text-3);
}
.modal-close:hover{background:var(--surface-hover);color:var(--text)}
.modal-close svg{width:14px;height:14px}
.modal-body{padding:0 20px 16px}
.modal-foot{
  padding:12px 20px 18px;
  display:flex;gap:8px;justify-content:flex-end;
  border-top:1px solid var(--border);
  margin-top:8px;
}

/* Search Modal */
.search-modal{max-width:560px}
.search-input-wrap{padding:14px 20px;border-bottom:1px solid var(--border)}
.search-input-wrap input{
  width:100%;font-size:15px;
  padding:6px 0;
}
.search-input-wrap input::placeholder{color:var(--text-4)}
.search-results{padding:6px;max-height:380px;overflow-y:auto}
.search-result{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;
  border-radius:var(--r-xs);
  cursor:pointer;
  transition:background 0.15s;
}
.search-result:hover,.search-result.highlighted{background:var(--surface-hover)}
.search-result .sr-dot{width:6px;height:6px;border-radius:50%;background:var(--provider-color,var(--text-4));flex-shrink:0}
.search-result .sr-text{flex:1;min-width:0}
.search-result .sr-title{font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-result .sr-snippet{font-size:11.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-result .sr-time{font-size:11px;color:var(--text-4)}
.search-empty{padding:36px 20px;text-align:center;color:var(--text-3);font-size:13px}

/* ============================================
   Mobile sidebar overlay
   ============================================ */
.sb-overlay{
  position:fixed;inset:0;
  background:rgba(8,7,6,0.7);
  backdrop-filter:blur(4px);
  z-index:998;
  opacity:0;visibility:hidden;
  transition:opacity 0.3s, visibility 0.3s;
}
.sb-overlay.open{opacity:1;visibility:visible}
.app.mobile .sidebar{
  position:fixed;
  left:0;top:0;bottom:0;
  z-index:999;
  transform:translateX(-100%);
  transition:transform 0.3s var(--ease);
  width:280px;
}
.app.mobile.sidebar-open .sidebar{transform:translateX(0)}

/* ============================================
   Responsive
   ============================================ */
@media (max-width: 900px){
  :root{--sidebar-w:0px}
  .app{grid-template-columns:1fr}
  .app.mobile{grid-template-columns:1fr}
  .sidebar{display:none}
  .app.mobile .sidebar{display:flex}
  .bn-item{display:flex}
  .bottom-nav{display:flex}
  .tb-mobile-menu{display:flex}
  .composer{padding:10px 14px 12px}
  .messages{padding:16px 14px 0}
  .msg-body{font-size:14px}
  .view{padding:24px 16px 80px}
  .chat-empty{padding:48px 20px 24px}
  .chat-suggestions{grid-template-columns:1fr}
  .home-quick{grid-template-columns:1fr 1fr}
  .projects-grid{grid-template-columns:1fr}
  .files-grid{grid-template-columns:repeat(auto-fill, minmax(140px, 1fr))}
  .ob-header{padding:16px 20px}
  .provider-grid{grid-template-columns:1fr}
  .auth-panel{padding:24px 20px}
  .composer-hint{display:none}
}
@media (max-width: 480px){
  .home-quick{grid-template-columns:1fr}
  .files-grid{grid-template-columns:1fr 1fr}
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:0.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:0.01ms !important;
  }
  .splash{display:none}
  .app{animation:none}
}

/* Focus visible */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
button:focus-visible, .btn:focus-visible{outline-offset:2px}
</style>

/* ---------- Utilities ---------- */
const $ = (s, c=document) => c.querySelector(s);
const $$ = (s, c=document) => Array.from(c.querySelectorAll(s));
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const debounce = (fn, ms=200) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(()=>fn(...a), ms); }; };
const escapeHtml = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function fmtTime(ts){
  const d = new Date(ts), now = new Date();
  const diff = (now - d) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
  if (diff < 86400*7) return Math.floor(diff/86400) + 'd ago';
  return d.toLocaleDateString(undefined, {month:'short', day:'numeric'});
}
function fmtClock(ts){
  const d = new Date(ts);
  return d.toLocaleTimeString(undefined, {hour:'numeric', minute:'2-digit'});
}
function fmtSize(bytes){
  if (!bytes) return '—';
  const u = ['B','KB','MB','GB']; let i = 0;
  while (bytes >= 1024 && i < u.length-1){ bytes /= 1024; i++; }
  return bytes.toFixed(bytes < 10 && i > 0 ? 1 : 0) + ' ' + u[i];
}

\`\`\`javascript
// Debounce — collapse rapid calls into a single trailing call
function debounce(fn, wait = 200) {
  let timer;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), wait);
  };
}

// Usage
const search = debounce((q) => {
  console.log('querying:', q);
}, 300);

input.addEventListener('input', e => search(e.target.value));
\`\`\`

The key idea: we discard intermediate calls and only run the final one after a quiet period. Useful for search-as-you-type, resize handlers, autosave — anywhere rapid firing would cause waste.

### The short version

It's a system that takes inputs, processes them, and produces outputs — but the interesting part is *how* the processing happens.

### The mechanics

Underneath, three things are happening:

2. **Transformation** — that representation is manipulated according to learned patterns.
3. **Decoding** — the result is mapped back into something useful for you.

### Why it matters

The same pattern shows up in everything from translation to image generation to search. Once you internalize the encode-transform-decode shape, a lot of systems become easier to reason about.

/* ---------- Provider Adapter (abstract) ---------- */
class ProviderAdapter {
  constructor(provider){ this.provider = provider; }
  async authenticate(){ throw new Error('not implemented'); }
  async *stream(message, history, model){ yield ''; }
  stop(){ this._stop = true; }
}

/* ---------- Demo Adapter (single valid integration) ---------- */
class DemoAdapter extends ProviderAdapter {
  constructor(provider){
    super(provider);
    this._stop = false;
  }
  async authenticate(){
    // Simulates opening the official provider website in a new tab,
    // waiting for the user to sign up or log in, and capturing the
    // session token that returns to OWL.
    await new Promise(r => setTimeout(r, 2800));
    return { ok: true, sessionToken: 'sess_' + uid() };
  }
  async *stream(message, history, model){
    const response = pickDemoResponse(message);
    const tokens = response.split(/(\s+)/);
    this._stop = false;
    for (let i = 0; i < tokens.length; i++){
      if (this._stop) return;
      yield tokens[i];
      // Variable latency for realistic feel
      const t = tokens[i];
      const delay = t.trim().length === 0 ? 12 : Math.min(60, 18 + t.length * 4);
      await new Promise(r => setTimeout(r, delay));
    }
  }
  stop(){ this._stop = true; }
}

/* ---------- UI: Modal ---------- */
const Modal = {
  open({title, body, actions=[]}){
    const root = $('#modalRoot');
    root.innerHTML = '';
    const back = document.createElement('div');
    back.className = 'modal-backdrop';
    back.innerHTML = `
      <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-head">
          <div class="modal-title">${title || ''}</div>
          <button class="modal-close" aria-label="Close">${ICON.close}</button>
        </div>
        <div class="modal-body">${body || ''}</div>
        ${actions.length ? `<div class="modal-foot">${actions.map((a,i)=>`<button class="btn ${a.primary?'btn-primary':''} ${a.danger?'btn-ghost':''}" data-i="${i}">${escapeHtml(a.label)}</button>`).join('')}</div>` : ''}
      </div>
    `;
    root.appendChild(back);
    const close = () => { root.innerHTML = ''; };
    back.addEventListener('click', e => { if (e.target === back) close(); });
    $('.modal-close', back).addEventListener('click', close);
    $$('.modal-foot button', back).forEach((b,i) => {
      b.addEventListener('click', () => {
        const a = actions[i];
        if (a.onClick) a.onClick(close);
        else close();
      });
    });
    return { close, root: back };
  },
  confirm({title, message, confirmLabel='Confirm', cancelLabel='Cancel', danger=false}){
    return new Promise(resolve => {
      Modal.open({
        title,
        body: `<p style="font-size:13.5px;color:var(--text-2);line-height:1.6">${escapeHtml(message)}</p>`,
        actions: [
          { label: cancelLabel, onClick: cl => { cl(); resolve(false); } },
          { label: confirmLabel, primary: !danger, danger, onClick: cl => { cl(); resolve(true); } }
        ]
      });
    });
  }
};
