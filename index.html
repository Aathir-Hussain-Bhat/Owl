  <style>
    :root {
      --glass-bg: rgba(255,255,255,0.03);
      --glass-border: rgba(255,255,255,0.08);
      --glass-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }

    body {
      background-color: #0a0a0c;
      color: #f3f3f5;
      overflow: hidden;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-feature-settings: 'ss01', 'cv11';
    }

    .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }

    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
    }

    @keyframes fadeInUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in-up { animation: fadeInUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) both; }
    @keyframes scaleIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
    .animate-scale-in { animation: scaleIn 0.25s ease-out both; }
    @keyframes slideLeft { from { transform: translateX(100%); } to { transform: translateX(0); } }
    .animate-slide-left { animation: slideLeft 0.3s cubic-bezier(0.16, 1, 0.3, 1) both; }
    @keyframes loadingBar { 0% { width: 0%; } 50% { width: 75%; } 100% { width: 100%; } }
    .animate-loading-bar { animation: loadingBar 1.2s ease-in-out forwards; }

    /* Owl Eye Animations */
    .owl-eye-blink {
      animation: eyeBlink 6s ease-in-out infinite;
      transform-origin: center;
      transform-box: fill-box;
    }
    @keyframes eyeBlink {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.05); }
    }

    .owl-iris-soft-pulse {
      animation: irisSoftPulse 4s ease-in-out infinite;
      transform-origin: center;
      transform-box: fill-box;
    }
    @keyframes irisSoftPulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.05); opacity: 1; }
    }

    .prose-owl {
      line-height: 1.7;
      font-size: 14.5px;
      color: #e5e5eb;
      user-select: text;
    }
    .prose-owl h1, .prose-owl h2, .prose-owl h3 { color: #fff; font-weight: 600; margin-top: 1.2em; margin-bottom: 0.5em; }
    .prose-owl h1 { font-size: 1.35rem; } .prose-owl h2 { font-size: 1.18rem; } .prose-owl h3 { font-size: 1.05rem; }
    .prose-owl p { margin-bottom: 0.85em; }
    .prose-owl ul, .prose-owl ol { margin-left: 1.25rem; margin-bottom: 0.85em; }
    .prose-owl li { margin-bottom: 0.25em; }
    .prose-owl :not(pre) > code { font-family: 'JetBrains Mono', monospace; background: #16161c; border:1px solid #282832; padding:0.15rem 0.38rem; border-radius:4px; font-size:0.85em; color:#e5a93c; }
    .prose-owl blockquote { border-left:3px solid #e5a93c; padding-left:1rem; color:#8e8e99; margin:1rem 0; font-style:italic; }

    /* Custom Code Container inside markdown */
    .owl-codeblock-container {
      margin: 1.25rem 0;
      border-radius: 12px;
      background: #0d0d11;
      border: 1px solid #24242c;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .owl-codeblock-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.55rem 1rem;
      background: #14141a;
      border-bottom: 1px solid #24242c;
      font-size: 0.75rem;
      color: #8e8e99;
    }
    .owl-codeblock-lang {
      font-family: 'JetBrains Mono', monospace;
      color: #e5a93c;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .owl-codeblock-actions {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }
    .owl-code-btn {
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      font-size: 0.72rem;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      color: #b0b0b8;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .owl-code-btn:hover {
      background: rgba(255,255,255,0.15);
      color: #ffffff;
      border-color: #e5a93c;
    }
    .owl-code-btn.canvas-btn {
      background: rgba(229, 169, 60, 0.15);
      border-color: rgba(229, 169, 60, 0.4);
      color: #f5c65e;
      font-weight: 600;
    }
    .owl-code-btn.canvas-btn:hover {
      background: #e5a93c;
      color: #0a0a0c;
    }
    pre[class*="language-"] {
      margin: 0 !important;
      padding: 1rem !important;
      background: #0d0d11 !important;
      border: none !important;
      font-size: 0.84rem !important;
      font-family: 'JetBrains Mono', monospace !important;
      line-height: 1.6 !important;
    }

    /* Chat Layout */
    .owl-chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1.25rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      background: rgba(10, 10, 12, 0.92);
      backdrop-filter: blur(12px);
      z-index: 20;
    }
    .owl-model-indicator {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.82rem;
      font-weight: 500;
      color: #d1d1d6;
      cursor: pointer;
      padding: 0.35rem 0.7rem;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03);
      transition: all 0.15s ease;
    }
    .owl-model-indicator:hover {
      background: rgba(255,255,255,0.08);
      color: #ffffff;
      border-color: rgba(229,169,60,0.4);
    }
    .owl-status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #34d399;
      flex-shrink: 0;
      box-shadow: 0 0 6px rgba(52, 211, 153, 0.4);
    }

    .owl-chat-scroll {
      padding: 2rem 1.5rem 8rem;
    }
    .owl-message-row {
      display: flex;
      margin-bottom: 2rem;
    }
    .owl-message-row.owl-user-row {
      justify-content: flex-end;
    }
    .owl-user-bubble {
      max-width: 82%;
      padding: 0.85rem 1.2rem;
      background: #1c1c23;
      border: 1px solid #2a2a34;
      border-radius: 16px;
      border-bottom-right-radius: 4px;
      color: #f3f3f5;
      font-size: 0.92rem;
      line-height: 1.65;
      word-break: break-word;
      box-shadow: 0 4px 15px rgba(0,0,0,0.25);
    }
    .owl-ai-block {
      max-width: 780px;
      width: 100%;
    }

    .owl-composer-wrapper {
      position: sticky;
      bottom: 0;
      padding: 0 1.5rem 1.2rem;
      background: linear-gradient(to top, #0a0a0c 75%, transparent);
      z-index: 20;
    }
    .owl-composer {
      max-width: 780px;
      margin: 0 auto;
      background: #121217;
      border: 1px solid #24242e;
      border-radius: 16px;
      padding: 0.75rem;
      transition: all 0.18s ease;
    }
    .owl-composer:focus-within {
      border-color: #e5a93c;
      background: #16161d;
      box-shadow: 0 0 25px rgba(229, 169, 60, 0.15);
    }
    .owl-composer-inner {
      display: flex;
      align-items: flex-end;
      gap: 0.5rem;
    }
    .owl-composer-textarea {
      flex: 1;
      background: transparent;
      border: none;
      resize: none;
      outline: none;
      color: #f3f3f5;
      font-size: 0.95rem;
      line-height: 1.6;
      max-height: 220px;
      min-height: 24px;
      padding: 0.4rem 0.35rem;
    }
    .owl-composer-send {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: #e5a93c;
      color: #0a0a0c;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      transition: all 0.15s ease;
    }
    .owl-composer-send:hover {
      background: #f1b952;
      transform: scale(1.04);
    }
    .owl-composer-send:disabled {
      background: #1f1f26;
      color: #4a4a54;
      cursor: not-allowed;
      transform: none;
    }

    /* Flashcard Style */
    .flash-code-card {
      background: #121217;
      border: 1px solid #23232c;
      border-radius: 14px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .flash-code-card:hover {
      border-color: rgba(229,169,60,0.45);
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.4);
    }

    /* Nav Item Spacing */
    .nav-item-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 0.65rem 0.85rem;
      border-radius: 10px;
      font-size: 0.84rem;
      font-weight: 500;
      transition: all 0.15s ease;
      margin-bottom: 0.25rem;
    }
    .nav-item-btn:hover {
      background: rgba(255,255,255,0.06);
      color: #ffffff;
    }
    .nav-item-btn.active {
      background: rgba(229, 169, 60, 0.14);
      color: #e5a93c;
      font-weight: 600;
      border: 1px solid rgba(229, 169, 60, 0.3);
    }
  </style>

      const extractedCodeSnippets = useMemo(() => {
        const list = [];
        (conversations || []).forEach(conv => {
          (conv.messages || []).forEach(msg => {
            if (msg.role === 'assistant' && msg.content) {
              const codeBlockRegex = /```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g;
              let match;
              let count = 1;
              while ((match = codeBlockRegex.exec(msg.content)) !== null) {
                const lang = match[1] || 'text';
                const code = match[2];
                const snippetId = `code-${conv.id}-${msg.id}-${count++}`;
                if (code && String(code).trim() && !deletedSnippetIds.includes(snippetId)) {
                  list.push({
                    id: snippetId,
                    chatId: conv.id,
                    chatTitle: conv.title || 'Conversation',
                    model: msg.model || conv.modelId,
                    timestamp: msg.timestamp || conv.createdAt,
                    language: String(lang).toLowerCase(),
                    code: String(code).trim(),

            }

      const renderMarkdown = useCallback((content) => {
        if (!content) return '';
        try {
          const renderer = new marked.Renderer();
          renderer.code = function({ text, lang }) {
            const rawCode = text || '';
            const language = String(lang || 'text').trim();
            const validLang = window.Prism && window.Prism.languages[language] ? language : 'text';
            let highlighted = rawCode;
            if (window.Prism && window.Prism.languages[validLang]) {
              try {
                highlighted = window.Prism.highlight(rawCode, window.Prism.languages[validLang], validLang);
              } catch (e) {
                highlighted = rawCode;
              }
            }
            
            const snipId = window.owlRegisterSnippet(rawCode, language);

            return `
              <div class="owl-codeblock-container">
                <div class="owl-codeblock-header">
                  <span class="owl-codeblock-lang">${language || 'CODE'}</span>
                  <div class="owl-codeblock-actions">

                      ⚡ Open in Canva
                    </button>
                  </div>
                </div>
                <pre class="language-${validLang}"><code class="language-${validLang}">${highlighted}</code></pre>
              </div>
            `;
          };

          marked.setOptions({ renderer, gfm: true, breaks: true });
          return DOMPurify.sanitize(marked.parse(content), {
            ADD_ATTR: ['onclick', 'target', 'title'],
            ADD_TAGS: ['button', 'pre', 'code', 'svg', 'path', 'g']
          });
        } catch (e) {
          return content;
        }

          const headers = { 'HTTP-Referer': window.location.origin, 'X-Title': 'OWL Workspace' };
          if (settings.apiKey) headers['Authorization'] = `Bearer ${String(settings.apiKey).trim()}`;
          const res = await fetch('https://openrouter.ai/api/v1/models', { headers });
          if (!res.ok) throw new Error(`HTTP ${res.status}: ${res.statusText}`);
          const json = await res.json();
          if (Array.isArray(json.data) && json.data.length > 0) {
            const formatted = json.data.map(item => {
              const id = item.id;
              const providerName = id.includes('/') ? id.split('/')[0] : 'OpenRouter';
              const isFreeTier = id.endsWith(':free');
              let badge = 'OR';
              if (providerName.includes('google')) badge = 'GO';
              else if (providerName.includes('anthropic')) badge = 'AN';
              else if (providerName.includes('openai')) badge = 'OA';
              else if (providerName.includes('deepseek')) badge = 'DS';
              else if (providerName.includes('meta') || providerName.includes('llama')) badge = 'ME';
              else if (providerName.includes('mistral')) badge = 'MI';
              else if (providerName.includes('qwen')) badge = 'QW';
              const caps = [];
              if (isFreeTier) caps.push('Free Tier');
              if (item.context_length > 100000) caps.push(`${Math.round(item.context_length / 1000)}k Context`);
              if (item.description && item.description.toLowerCase().includes('vision')) caps.push('Vision');
              if (item.description && item.description.toLowerCase().includes('code')) caps.push('Coding');
              if (caps.length === 0) caps.push('Reasoning');
              return {
                id, name: item.name || item.id, provider: providerName.toUpperCase(), badge, capabilities: caps,
                context_length: item.context_length || 128000,
                pricing: isFreeTier ? '100% Free' : item.pricing?.prompt ? `$${(parseFloat(item.pricing.prompt) * 1000000).toFixed(2)}/1M` : 'Pay-per-token',
                isFree: isFreeTier, desc: item.description || `Multi-modal model from ${providerName}.`, corsSupported: true
              };
            });
            setModels(formatted);
            if (showNotification) showToast(`Synchronized ${formatted.length} live models!`);
          }
        } catch (err) {
          if (showNotification) showToast(`Model sync warning: ${err.message}.`);
        } finally {
          setIsFetchingModels(false);
        }
      };

      const handleSaveCustomModel = () => {
        const id = String(customModelForm.id || '').trim();
        const name = String(customModelForm.name || '').trim();
        if (!id || !name) {
          showToast('Model ID and Name are required.'); return;
        }
        const caps = String(customModelForm.capabilities || '').split(',').map(c => c.trim()).filter(Boolean);
        if (!caps.includes('Custom')) caps.unshift('Custom Model');
        const newCustom = {
          id, name, provider: String(customModelForm.provider || 'Custom').trim(),
          badge: 'CU', capabilities: caps, context_length: customModelForm.contextLength || '128k', pricing: 'Configured',
          isCustom: true, systemRole: String(customModelForm.systemRole || '').trim(), apiKey: String(customModelForm.apiKey || '').trim(),
          desc: customModelForm.systemRole ? `Specialized System Role: "${customModelForm.systemRole.slice(0, 75)}..."` : 'Custom user-configured LLM endpoint.',
          corsSupported: true
        };
        setCustomModels(prev => [newCustom, ...prev.filter(m => m.id !== newCustom.id)]);
        setModalCustomModelOpen(false);
        setCustomModelForm({ id: '', name: '', provider: 'OpenRouter', systemRole: '', apiKey: '', contextLength: '128k', capabilities: 'Coding, Analysis' });
        showToast(`Custom model "${newCustom.name}" saved!`);
      };

      const allAvailableModels = useMemo(() => [...customModels, ...models], [customModels, models]);

      const filteredModelsList = useMemo(() => {
        return allAvailableModels.filter(m => {
          if (modelFilterTag === 'free' && !m.isFree) return false;
          if (modelFilterTag === 'custom' && !m.isCustom) return false;
          if (modelFilterTag === 'favorites' && !favorites.includes(m.id)) return false;
          if (modelFilterTag === 'google' && !String(m.provider || '').toLowerCase().includes('google')) return false;
          if (modelFilterTag === 'anthropic' && !String(m.provider || '').toLowerCase().includes('anthropic')) return false;
          if (modelFilterTag === 'openai' && !String(m.provider || '').toLowerCase().includes('openai')) return false;
          if (modelFilterTag === 'deepseek' && !String(m.provider || '').toLowerCase().includes('deepseek')) return false;
          if (modelFilterTag === 'meta' && !String(m.provider || '').toLowerCase().includes('meta')) return false;
          if (!String(modelSearchQuery || '').trim()) return true;
          const q = String(modelSearchQuery).toLowerCase();
          return String(m.name || '').toLowerCase().includes(q) || String(m.id || '').toLowerCase().includes(q) || String(m.provider || '').toLowerCase().includes(q) || (m.desc && String(m.desc).toLowerCase().includes(q));
        });
      }, [allAvailableModels, modelFilterTag, modelSearchQuery, favorites]);

      const activeChat = useMemo(() => conversations.find(c => c.id === currentChatId) || null, [conversations, currentChatId]);

      // In-Chat Search Matches Counter
      const inChatSearchResults = useMemo(() => {
        const query = String(inChatSearchQuery || '').trim().toLowerCase();
        if (!query || !activeChat) return 0;
        let matches = 0;
        (activeChat.messages || []).forEach(m => {
          const text = String(m.content || '').toLowerCase();
          const count = text.split(query).length - 1;
          matches += count;
        });
        return matches;
      }, [activeChat, inChatSearchQuery]);

      /* =========================================================================
         DETERMINISTIC STREAMING & RUN TEAM DISPATCHER
      ========================================================================= */
      const executeSendMessage = useCallback(async (textPrompt, targetChatId, targetModelId, targetProjectId, files = []) => {
        const prompt = String(textPrompt || '').trim();
        if (!prompt && files.length === 0) return;

        const customModelObj = customModels.find(m => m.id === targetModelId);
        const effectiveApiKey = customModelObj?.apiKey || settings.apiKey;
        if (!effectiveApiKey || !String(effectiveApiKey).trim()) {
          showToast('API Key required. Please configure in Settings.');
          navigateTo('settings');
          return;
        }

        let formattedUserContent;
        if (files.length > 0) {
          formattedUserContent = [];
          if (prompt) formattedUserContent.push({ type: 'text', text: prompt });
          files.forEach(file => {
            if (file.isImage) {
              formattedUserContent.push({ type: 'image_url', image_url: { url: file.content } });
            } else {
              formattedUserContent.push({ type: 'text', text: `\n\n--- Attachment: ${file.name} ---\n\`\`\`\n${file.content}\n\`\`\`` });
            }
          });
        } else {
          formattedUserContent = prompt;
        }

        const displayUserMessage = prompt + (files.length > 0 ? `\n\n*(Attached ${files.length} file/image)*` : '');
        const userMsg = { id: 'msg-' + Date.now(), role: 'user', content: displayUserMessage, rawPayload: formattedUserContent, timestamp: new Date().toISOString() };
        
        // Find existing messages
        const existingConv = conversations.find(c => c.id === targetChatId);
        const existingMessages = existingConv ? existingConv.messages : [];
        const updatedMessages = [...existingMessages, userMsg];
        const newTitle = existingMessages.length === 0 ? prompt.slice(0, 32) : (existingConv?.title || 'Conversation');

        setConversations(prev => prev.map(c => c.id === targetChatId ? { ...c, title: newTitle, messages: updatedMessages } : c));
        setChatInput('');
        if (textareaRef.current) textareaRef.current.style.height = 'auto';
        setAttachedFiles([]);
        setIsStreaming(true);

        const aiMsgId = 'msg-ai-' + Date.now();
        const placeholderAiMsg = { id: aiMsgId, role: 'assistant', content: '', timestamp: new Date().toISOString(), model: targetModelId };
        setConversations(prev => prev.map(c => c.id === targetChatId ? { ...c, messages: [...updatedMessages, placeholderAiMsg] } : c));

        const controller = new AbortController();
        setAbortController(controller);

        try {
          let messagesPayload = [];
          if (customModelObj && customModelObj.systemRole) messagesPayload.push({ role: 'system', content: customModelObj.systemRole });
          if (targetProjectId) {
            const proj = projects.find(p => p.id === targetProjectId);
            if (proj && proj.systemPrompt) messagesPayload.push({ role: 'system', content: proj.systemPrompt });
          }

          updatedMessages.forEach(m => {
            messagesPayload.push({ role: m.role, content: m.rawPayload || m.content });
          });

          const endpoint = (settings.endpoint || 'https://openrouter.ai/api/v1').replace(/\/$/, '');
          const response = await fetch(`${endpoint}/chat/completions`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${String(effectiveApiKey).trim()}`, 'HTTP-Referer': window.location.origin, 'X-Title': 'OWL AI Workspace' },
            body: JSON.stringify({ model: targetModelId, messages: messagesPayload, stream: true }),
            signal: controller.signal
          });

          if (!response.ok) {
            const errData = await response.json().catch(() => ({}));
            throw new Error(errData.error?.message || `HTTP ${response.status}: ${response.statusText}`);
          }

          const reader = response.body.getReader();
          const decoder = new TextDecoder('utf-8');
          let buffer = '';
          let accumulatedContent = '';

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop();

            for (const line of lines) {
              const trimmed = line.trim();
              if (!trimmed || trimmed.startsWith(':')) continue;
              if (trimmed === 'data: [DONE]') continue;
              if (trimmed.startsWith('data: ')) {
                try {
                  const parsed = JSON.parse(trimmed.slice(6));
                  const delta = parsed.choices?.[0]?.delta?.content || '';
                  if (delta) {
                    accumulatedContent += delta;
                    setConversations(prev => prev.map(c => {
                      if (c.id !== targetChatId) return c;
                      const msgs = c.messages.map(m => m.id === aiMsgId ? { ...m, content: accumulatedContent } : m);
                      return { ...c, messages: msgs };
                    }));
                  }
                } catch (e) {}
              }
            }
          }
        } catch (error) {
          if (error.name !== 'AbortError') {
            const errorDisplay = `⚠️ **Request Error:** ${error.message}\n\n*Verify that your API key is valid and authorized.*`;
            setConversations(prev => prev.map(c => {
              if (c.id !== targetChatId) return c;
              const msgs = c.messages.map(m => m.id === aiMsgId ? { ...m, content: errorDisplay, isError: true } : m);
              return { ...c, messages: msgs };
            }));
            showToast(`Error: ${error.message}`);
          }
        } finally {
          setIsStreaming(false);
          setAbortController(null);
        }
      }, [conversations, customModels, settings.apiKey, settings.endpoint, projects, showToast, navigateTo]);

      const handleStartNewChat = useCallback((modelId = selectedModel, projectId = activeProjectId, initialPrompt = null) => {
        const newChatId = 'chat-' + Date.now();
        const model = modelId || selectedModel || 'google/gemini-2.0-flash-001';
        const newChat = {
          id: newChatId,
          title: initialPrompt ? String(initialPrompt).slice(0, 32) : 'New Conversation',
          modelId: model,
          projectId: projectId || null,
          createdAt: new Date().toISOString(),
          messages: []
        };

        setConversations(prev => [newChat, ...prev]);
        setCurrentChatId(newChatId);
        setSelectedModel(model);
        setActiveProjectId(projectId || null);
        setInChatSearchOpen(false);
        setInChatSearchQuery('');
        navigateTo('chat');

        if (initialPrompt && String(initialPrompt).trim()) {
          setTimeout(() => {
            executeSendMessage(initialPrompt, newChatId, model, projectId, []);
          }, 80);
        } else {
          showToast(`Started new chat with ${model.split('/')[1] || model}`);
        }
      }, [selectedModel, activeProjectId, navigateTo, showToast, executeSendMessage]);

      const handleOpenConversation = useCallback((id) => {
        const conv = conversations.find(c => c.id === id);
        if (conv) {
          setCurrentChatId(id);
          setSelectedModel(conv.modelId);
          setActiveProjectId(conv.projectId);
          setInChatSearchOpen(false);
          setInChatSearchQuery('');
          navigateTo('chat');
        }
      }, [conversations, navigateTo]);

      const handleDeleteConversation = useCallback((id) => {
        setConversations(prev => prev.filter(c => c.id !== id));
        if (currentChatId === id) {
          setCurrentChatId(null);
          navigateTo('home');
        }
        showToast('Conversation deleted');
      }, [currentChatId, navigateTo, showToast]);

      const handleSelectModel = useCallback((modelId) => {
        setRecentModelIds(prev => [modelId, ...prev.filter(id => id !== modelId)].slice(0, 8));
        if (activeChat && activeChat.messages.length > 0 && activeChat.modelId !== modelId) {
          showToast(`Opening new conversation for ${modelId.split('/')[1] || modelId}`);
          handleStartNewChat(modelId, activeProjectId);
        } else if (activeChat) {
          setConversations(prev => prev.map(c => c.id === currentChatId ? { ...c, modelId } : c));
          setSelectedModel(modelId);
          showToast(`Model set to ${modelId.split('/')[1] || modelId}`);
        } else {
          setSelectedModel(modelId);
          handleStartNewChat(modelId, activeProjectId);
        }
      }, [activeChat, currentChatId, activeProjectId, handleStartNewChat, showToast]);

      const handleFileSelect = useCallback((e) => {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;
        files.forEach(file => {
          const reader = new FileReader();
          reader.onload = (ev) => {
            setAttachedFiles(prev => [...prev, { name: file.name, type: file.type, size: file.size, content: ev.target.result, isImage: file.type.startsWith('image/') }]);
            showToast(`Attached ${file.name}`);
          };
          if (file.type.startsWith('image/')) reader.readAsDataURL(file);
          else reader.readAsText(file);
        });
        e.target.value = '';
      }, [showToast]);

      const removeAttachment = useCallback((index) => setAttachedFiles(prev => prev.filter((_, i) => i !== index)), []);

      const autoResizeTextarea = (e) => {
        setChatInput(e.target.value);
        e.target.style.height = 'auto';
        e.target.style.height = `${Math.min(e.target.scrollHeight, 220)}px`;
      };

      const handleSendMessageFromComposer = () => {
        if (!currentChatId) {
          handleStartNewChat(selectedModel, activeProjectId, chatInput);
        } else {
          executeSendMessage(chatInput, currentChatId, selectedModel, activeProjectId, attachedFiles);
        }
      };

      const stopStreaming = useCallback(() => { if (abortController) abortController.abort(); }, [abortController]);

      const copyToClipboard = (text) => {
        if (!text) return;
        navigator.clipboard.writeText(text).then(() => showToast('Copied to clipboard'));
      };

      const toggleFavorite = (modelId) => {
        setFavorites(prev => prev.includes(modelId) ? prev.filter(id => id !== modelId) : [...prev, modelId]);
      };

      const downloadSnippetFile = (code, lang = 'txt') => {
        const blob = new Blob([code || ''], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `owl-artifact-${Date.now()}.${lang || 'txt'}`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('Downloaded code file');
      };

      const openCodeInNewTab = (code) => {
        const blob = new Blob([code || ''], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        window.open(url, '_blank');
      };

      // Modal Handlers
      const handleCreateProject = () => {
        const title = String(projectForm.title || '').trim();
        const desc = String(projectForm.desc || '').trim();
        if (!title) { showToast('Project title is required.'); return; }
        const newProj = { id: 'p-' + Date.now(), title, desc, systemPrompt: String(projectForm.systemPrompt || desc).trim() };
        setProjects(prev => [...prev, newProj]);
        setModalProjectOpen(false);
        setProjectForm({ title: '', desc: '', systemPrompt: '' });
        showToast(`Project "${newProj.title}" created`);
      };

      const handleSavePrompt = () => {
        const title = String(promptForm.title || '').trim();
        const content = String(promptForm.content || '').trim();
        if (!title || !content) { showToast('Title and content are required.'); return; }
        if (editingPrompt) {
          setPrompts(prev => prev.map(p => p.id === editingPrompt.id ? { ...p, title, content } : p));
          showToast('Prompt updated in library');
        } else {
          const newP = { id: 'pr-' + Date.now(), title, content, date: 'Saved' };
          setPrompts(prev => [...prev, newP]);
          showToast('Prompt saved to library');
        }
        setModalPromptOpen(false);
        setEditingPrompt(null);
        setPromptForm({ title: '', content: '' });
      };

      const handleOpenEditPrompt = (p) => {
        setEditingPrompt(p);
        setPromptForm({ title: p.title || '', content: p.content || '' });
        setModalPromptOpen(true);
      };

      const handleSaveTeam = () => {
        const title = String(teamForm.title || '').trim();
        const tag = String(teamForm.tag || '').trim();
        if (!title || !tag) { showToast('Team title and tag are required.'); return; }
        if (editingTeam) {
          setTeams(prev => prev.map(t => t.id === editingTeam.id ? { ...t, ...teamForm } : t));
          showToast('Team updated');
        } else {
          const newTeam = { id: 't-' + Date.now(), ...teamForm };
          setTeams(prev => [...prev, newTeam]);
          showToast('Team created');
        }
        setModalTeamOpen(false);
        setEditingTeam(null);
        setTeamForm({ tag: '', title: '', desc: '', meta: '' });
      };

      const handleSaveSkill = () => {
        const title = String(skillForm.title || '').trim();
        const prompt = String(skillForm.prompt || '').trim();
        if (!title || !prompt) { showToast('Skill title and prompt are required.'); return; }
        if (editingSkill) {
          setSkills(prev => prev.map(s => s.id === editingSkill.id ? { ...s, ...skillForm } : s));
          showToast('Skill updated');
        } else {
          const newSkill = { id: 's-' + Date.now(), ...skillForm };
          setSkills(prev => [...prev, newSkill]);
          showToast('Skill created');
        }
        setModalSkillOpen(false);
        setEditingSkill(null);
        setSkillForm({ title: '', desc: '', prompt: '' });
      };

      return (
        <div className="flex h-screen w-screen overflow-hidden bg-brand-black text-[#f3f3f5] font-sans antialiased">
          
          {/* INITIAL BOOT LOADING SCREEN */}
          <div className={`fixed inset-0 z-[9999] bg-[#0a0a0d] flex flex-col items-center justify-center transition-all duration-700 pointer-events-none ${appLoading ? 'opacity-100' : 'opacity-0 scale-105'}`}>
            <div className="flex flex-col items-center gap-5 p-8 max-w-sm w-full text-center">
              <MotionOwlEyes size="lg" />
              <div>
                <h1 className="font-serif text-2xl font-bold tracking-widest text-brand-gold">OWL</h1>
                <p className="text-[11px] font-mono tracking-wider text-gray-500 uppercase mt-1">Intelligent AI Workspace & Code Canvas</p>
              </div>
              <div className="w-48 h-1 bg-white/10 rounded-full overflow-hidden mt-3">
                <div className="h-full bg-gradient-to-r from-brand-gold to-amber-300 animate-loading-bar"></div>
              </div>
              <span className="text-[10px] font-mono text-gray-600">Initializing sandbox environment...</span>
            </div>
          </div>

          {/* Ambient Glows */}
          <div className="fixed inset-0 z-0 pointer-events-none">
            <div className="absolute top-0 -left-40 w-96 h-96 bg-brand-gold/5 rounded-full filter blur-3xl" />
            <div className="absolute bottom-0 right-0 w-96 h-96 bg-brand-gold/5 rounded-full filter blur-3xl" />
          </div>

          {/* Mobile Backdrop */}
          {sidebarOpen && (
            <div className="fixed inset-0 z-40 bg-black/70 backdrop-blur-sm md:hidden" onClick={() => setSidebarOpen(false)} />
          )}

          {/* SIDEBAR */}
          <aside className={`fixed md:static inset-y-0 left-0 z-50 w-[275px] bg-brand-surface/90 backdrop-blur-xl border-r border-white/10 flex flex-col transition-transform duration-300 ease-in-out ${sidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'}`}>
            
            {/* Top Logo & New Chat */}
            <div className="p-4 flex flex-col gap-3.5 border-b border-white/5">
              <div className="flex items-center justify-between">
                <div className="flex items-center gap-2.5 cursor-pointer" onClick={() => navigateTo('home')}>
                  <MotionOwlEyes size="sm" />
                  <span className="font-serif text-lg font-bold tracking-wide text-brand-gold">OWL</span>
                </div>
                <span className="text-[10px] font-mono text-gray-500 uppercase tracking-widest bg-white/5 px-2 py-0.5 rounded border border-white/5">v2.6</span>
              </div>
              
              <button onClick={() => handleStartNewChat()} className="flex items-center justify-between w-full px-3.5 py-2.5 bg-brand-gold/15 hover:bg-brand-gold/25 border border-brand-gold/40 rounded-xl text-xs font-semibold text-brand-gold transition-all shadow-glow">
                <span className="flex items-center gap-2"><Icon name="plus" className="w-4 h-4 text-brand-gold" /> New conversation</span>
                <span className="text-[10px] font-mono bg-brand-gold/20 px-1.5 py-0.5 rounded text-brand-gold">⌘N</span>
              </button>
            </div>

            {/* Navigation Menu */}
            <nav className="p-3 overflow-y-auto custom-scrollbar flex-1 space-y-1">
              {[
                { id: 'home', label: 'Home', icon: 'layout-grid' },
                { id: 'chat', label: 'Chats', icon: 'message-square', badge: conversations.length },
                { id: 'codes', label: 'Codes & Canvas', icon: 'code', badge: extractedCodeSnippets.length, highlight: true },
                { id: 'projects', label: 'Projects', icon: 'folder', badge: projects.length },
                { id: 'library', label: 'Library', icon: 'book-open' },
                { id: 'models', label: 'Models', icon: 'grid', badge: allAvailableModels.length },
                { id: 'teams', label: 'Teams & Skills', icon: 'users' },
                { id: 'creator', label: 'Creator', icon: 'star' },
                { id: 'notifications', label: 'Notifications', icon: 'bell' },
                { id: 'settings', label: 'Settings', icon: 'settings' }
              ].map((item) => {
                const isActive = currentView === item.id;
                return (
                  <button
                    key={item.id}
                    onClick={() => navigateTo(item.id)}
                    className={`nav-item-btn ${isActive ? 'active' : 'text-gray-400'} ${item.highlight && !isActive ? 'text-amber-200/90' : ''}`}
                  >
                    <div className="flex items-center gap-3">
                      <Icon name={item.icon} className={`w-4 h-4 ${isActive ? 'text-brand-gold' : item.highlight ? 'text-brand-gold' : 'text-gray-400'}`} />
                      <span>{item.label}</span>
                    </div>
                    {item.badge !== undefined && (
                      <span className={`text-[10px] font-semibold px-2 py-0.5 rounded-full ${item.highlight ? 'bg-brand-gold/25 text-brand-gold' : 'text-gray-400 bg-white/5'}`}>{item.badge}</span>
                    )}
                  </button>
                );
              })}

              <button onClick={() => setReadmeOpen(true)} className="nav-item-btn text-brand-gold mt-2">
                <div className="flex items-center gap-3">
                  <Icon name="help-circle" className="w-4 h-4 text-brand-gold" />
                  <span>Architecture & Guide</span>
                </div>
              </button>

              {/* Install PWA Button */}
              {pwaPrompt && (
                <button onClick={handleTriggerPwaInstall} className="nav-item-btn bg-brand-gold/20 text-brand-gold border border-brand-gold/40 mt-1 font-semibold">
                  <div className="flex items-center gap-3">
                    <Icon name="app-install" className="w-4 h-4 text-brand-gold" />
                    <span>Install OWL App</span>
                  </div>
                </button>
              )}
            </nav>

            {/* EXPANDED CHAT HISTORY CONTAINER */}
            <div className="p-3 border-t border-white/10 bg-white/[0.02]">
              <div
                className="text-[10px] font-semibold text-gray-500 uppercase tracking-wider mb-2 px-1 flex justify-between items-center cursor-pointer hover:text-gray-300"
                onClick={() => setSidebarHistoryExpanded(!sidebarHistoryExpanded)}
              >
                <span className="flex items-center gap-1.5">
                  <Icon name={sidebarHistoryExpanded ? "chevron-down" : "chevron-right"} className="w-3 h-3 text-brand-gold" />
                  <span>Recent Conversations ({conversations.length})</span>

                  <MotionOwlEyes size="sm" />
                  <span className="font-serif text-base font-semibold text-white">{canvasData.title}</span>
                  <span className="text-[10px] font-mono uppercase bg-brand-gold/15 text-brand-gold px-2.5 py-0.5 rounded border border-brand-gold/30">{canvasData.language}</span>
                </div>

                {/* View Switcher Controls */}
                <div className="flex items-center gap-3">
                  <div className="flex bg-white/5 rounded-xl p-1 border border-white/10 text-xs">
                    <button onClick={() => setCanvasData({ ...canvasData, activeTab: 'code' })} className={`px-3 py-1.5 rounded-lg transition-all flex items-center gap-1.5 ${canvasData.activeTab === 'code' ? 'bg-brand-gold text-black font-semibold' : 'text-gray-400 hover:text-white'}`}>
                      <Icon name="code" className="w-3.5 h-3.5" /> Code
                    </button>
                    <button onClick={() => setCanvasData({ ...canvasData, activeTab: 'preview' })} className={`px-3 py-1.5 rounded-lg transition-all flex items-center gap-1.5 ${canvasData.activeTab === 'preview' ? 'bg-brand-gold text-black font-semibold' : 'text-gray-400 hover:text-white'}`}>
                      <Icon name="play" className="w-3.5 h-3.5" /> Live Preview
                    </button>
                  </div>

                  {canvasData.activeTab === 'preview' && (
                    <div className="hidden md:flex bg-white/5 rounded-xl p-1 border border-white/10 text-xs">
                      <button onClick={() => setCanvasData({ ...canvasData, viewport: 'full' })} className={`px-2.5 py-1 rounded-lg ${canvasData.viewport === 'full' ? 'bg-white/15 text-white' : 'text-gray-400'}`}>Desktop</button>
                      <button onClick={() => setCanvasData({ ...canvasData, viewport: 'tablet' })} className={`px-2.5 py-1 rounded-lg ${canvasData.viewport === 'tablet' ? 'bg-white/15 text-white' : 'text-gray-400'}`}>Tablet</button>
                      <button onClick={() => setCanvasData({ ...canvasData, viewport: 'mobile' })} className={`px-2.5 py-1 rounded-lg ${canvasData.viewport === 'mobile' ? 'bg-white/15 text-white' : 'text-gray-400'}`}>Mobile</button>
                    </div>
                  )}

                  <div className="flex items-center gap-1">
                    <button onClick={() => openCodeInNewTab(canvasData.code)} className="p-2 text-gray-400 hover:text-white rounded-lg hover:bg-white/10" title="Open in New Tab">
                      <Icon name="external-link" className="w-4 h-4" />
                    </button>
                    <button onClick={() => copyToClipboard(canvasData.code)} className="p-2 text-gray-400 hover:text-white rounded-lg hover:bg-white/10" title="Copy">
                      <Icon name="copy" className="w-4 h-4" />
                    </button>
                    <button onClick={() => downloadSnippetFile(canvasData.code, canvasData.language)} className="p-2 text-gray-400 hover:text-white rounded-lg hover:bg-white/10" title="Download">
                      <Icon name="download" className="w-4 h-4" />
                    </button>
                    <button onClick={() => setCanvasData({ ...canvasData, isFullscreen: !canvasData.isFullscreen })} className="p-2 text-gray-400 hover:text-white rounded-lg hover:bg-white/10" title="Toggle Size">
                      <Icon name={canvasData.isFullscreen ? "minimize" : "maximize"} className="w-4 h-4" />
                    </button>
                    <button onClick={() => setCanvasData(null)} className="p-2 text-gray-400 hover:text-rose-400 rounded-lg hover:bg-white/10 ml-2" title="Close Canva">
                      <Icon name="close" className="w-5 h-5" />
                    </button>
                  </div>
                </div>
              </div>

              {/* Studio Canvas Body */}
              <div className="flex-1 overflow-auto bg-[#07070a] relative custom-scrollbar flex items-center justify-center p-2">
                {canvasData.activeTab === 'code' ? (
                  <div className="w-full h-full p-6 font-mono text-xs text-gray-300 overflow-auto custom-scrollbar">
                    <pre><code className={`language-${canvasData.language}`}>{canvasData.code}</code></pre>
                  </div>
                ) : (
                  <div className={`transition-all duration-300 h-full flex flex-col items-center justify-center ${canvasData.viewport === 'mobile' ? 'w-[375px]' : canvasData.viewport === 'tablet' ? 'w-[768px]' : 'w-full'}`}>
                    <iframe
                      title="Live Studio Sandbox"
                      sandbox="allow-scripts allow-modals allow-same-origin"
                      srcDoc={canvasData.language === 'svg' ? `<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0d0d11;">${canvasData.code}</div>` : canvasData.code}
                      className="w-full h-full rounded-xl border border-white/15 bg-white shadow-canvas"
                    />
                  </div>
                )}
              </div>
            </div>
          )}

          {/* MODALS */}
          {modalCustomModelOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-[#141418] border border-brand-gold/40 p-6 md:p-8 rounded-3xl max-w-xl w-full space-y-4 max-h-[90vh] overflow-y-auto custom-scrollbar shadow-glass">
                <div className="flex justify-between items-center pb-2 border-b border-white/10"><div className="flex items-center gap-2"><Icon name="cpu" className="w-5 h-5 text-brand-gold" /><h3 className="font-serif text-lg font-bold text-white">Add Custom Model</h3></div><button onClick={() => setModalCustomModelOpen(false)} className="text-gray-400 hover:text-white"><Icon name="close" className="w-5 h-5" /></button></div>
                <div className="space-y-3 text-xs">
                  <div><label className="block text-gray-300 font-semibold mb-1">Model ID</label><input type="text" value={customModelForm.id} onChange={(e) => setCustomModelForm({ ...customModelForm, id: e.target.value })} placeholder="e.g. mistralai/codestral-2501" className="w-full bg-white/5 border border-white/10 focus:border-brand-gold rounded-xl px-3 py-2 text-white font-mono outline-none" /></div>
                  <div><label className="block text-gray-300 font-semibold mb-1">Display Name</label><input type="text" value={customModelForm.name} onChange={(e) => setCustomModelForm({ ...customModelForm, name: e.target.value })} placeholder="e.g. Senior Security Auditor" className="w-full bg-white/5 border border-white/10 focus:border-brand-gold rounded-xl px-3 py-2 text-white outline-none" /></div>
                  <div><label className="block text-gray-300 font-semibold mb-1">System Role</label><textarea value={customModelForm.systemRole} onChange={(e) => setCustomModelForm({ ...customModelForm, systemRole: e.target.value })} placeholder="You are an expert..." rows={3} className="w-full bg-white/5 border border-white/10 focus:border-brand-gold rounded-xl px-3 py-2 text-white outline-none" /></div>
                </div>
                <div className="flex justify-end gap-2 pt-3 border-t border-white/10"><button onClick={() => setModalCustomModelOpen(false)} className="px-4 py-2 bg-white/5 text-xs rounded-xl text-gray-300">Cancel</button><button onClick={handleSaveCustomModel} className="px-5 py-2 bg-brand-gold hover:bg-brand-goldHover text-black text-xs font-semibold rounded-xl shadow-glow">Save Model</button></div>
              </div>
            </div>
          )}

          {modalProjectOpen && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#141418] border border-white/20 p-6 rounded-2xl max-w-md w-full space-y-3 shadow-glass">
                <h3 className="text-base font-semibold text-white">Create New Project</h3>
                <input type="text" placeholder="Project Title" value={projectForm.title} onChange={(e) => setProjectForm({ ...projectForm, title: e.target.value })} className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-xs text-white outline-none" />
                <textarea placeholder="Instructions..." rows={3} value={projectForm.desc} onChange={(e) => setProjectForm({ ...projectForm, desc: e.target.value, systemPrompt: e.target.value })} className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-xs text-white outline-none" />
                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={() => setModalProjectOpen(false)} className="px-3 py-1.5 bg-white/5 text-xs rounded-xl text-gray-300">Cancel</button>
                  <button onClick={handleCreateProject} className="px-3 py-1.5 bg-brand-gold text-black text-xs font-semibold rounded-xl">Create</button>
                </div>
              </div>
            </div>
          )}

          {/* EDIT/ADD PROMPT MODAL */}
          {modalPromptOpen && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#141418] border border-white/20 p-6 rounded-2xl max-w-md w-full space-y-3 shadow-glass">
                <h3 className="text-base font-semibold text-white">{editingPrompt ? 'Edit Saved Prompt' : 'Add Saved Prompt'}</h3>
                <input type="text" placeholder="Title" value={promptForm.title} onChange={(e) => setPromptForm({ ...promptForm, title: e.target.value })} className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-xs text-white outline-none" />
                <textarea placeholder="Instructions..." rows={4} value={promptForm.content} onChange={(e) => setPromptForm({ ...promptForm, content: e.target.value })} className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-xs text-white outline-none" />
                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={() => { setModalPromptOpen(false); setEditingPrompt(null); }} className="px-3 py-1.5 bg-white/5 text-xs rounded-xl text-gray-300">Cancel</button>
                  <button onClick={handleSavePrompt} className="px-3 py-1.5 bg-brand-gold text-black text-xs font-semibold rounded-xl">{editingPrompt ? 'Update' : 'Save'}</button>
                </div>
              </div>
            </div>
          )}

          {modalTeamOpen && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#141418] border border-white/20 p-6 rounded-2xl max-w-md w-full space-y-3 shadow-glass">
                <h3 className="text-base font-semibold text-white">{editingTeam ? 'Edit Team' : 'Add Team'}</h3>
                <input type="text" placeholder="Tag (e.g. CODING TEAM)" value={teamForm.tag} onChange={(e) => setTeamForm({ ...teamForm, tag: e.target.value })} className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-xs text-white outline-none" />
                <input type="text" placeholder="Title" value={teamForm.title} onChange={(e) => setTeamForm({ ...teamForm, title: e.target.value })} className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-xs text-white outline-none" />
                <textarea placeholder="Description / Protocol" rows={3} value={teamForm.desc} onChange={(e) => setTeamForm({ ...teamForm, desc: e.target.value })} className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-xs text-white outline-none" />
                <input type="text" placeholder="Meta" value={teamForm.meta} onChange={(e) => setTeamForm({ ...teamForm, meta: e.target.value })} className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-xs text-white outline-none" />
                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={() => { setModalTeamOpen(false); setEditingTeam(null); }} className="px-3 py-1.5 bg-white/5 text-xs rounded-xl text-gray-300">Cancel</button>
                  <button onClick={handleSaveTeam} className="px-3 py-1.5 bg-brand-gold text-black text-xs font-semibold rounded-xl">{editingTeam ? 'Update' : 'Create'}</button>
                </div>
              </div>
            </div>
          )}

          {modalSkillOpen && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#141418] border border-white/20 p-6 rounded-2xl max-w-md w-full space-y-3 shadow-glass">
                <h3 className="text-base font-semibold text-white">{editingSkill ? 'Edit Skill' : 'Add Skill'}</h3>
                <input type="text" placeholder="Skill Title" value={skillForm.title} onChange={(e) => setSkillForm({ ...skillForm, title: e.target.value })} className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-xs text-white outline-none" />
                <textarea placeholder="Description" rows={2} value={skillForm.desc} onChange={(e) => setSkillForm({ ...skillForm, desc: e.target.value })} className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-xs text-white outline-none" />
                <textarea placeholder="Prompt template..." rows={3} value={skillForm.prompt} onChange={(e) => setSkillForm({ ...skillForm, prompt: e.target.value })} className="w-full bg-white/5 border border-white/10 rounded-xl px-3 py-2 text-xs text-white outline-none" />
                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={() => { setModalSkillOpen(false); setEditingSkill(null); }} className="px-3 py-1.5 bg-white/5 text-xs rounded-xl text-gray-300">Cancel</button>
                  <button onClick={handleSaveSkill} className="px-3 py-1.5 bg-brand-gold text-black text-xs font-semibold rounded-xl">{editingSkill ? 'Update' : 'Create'}</button>
                </div>
              </div>
            </div>
          )}

          {onboardingOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-xl flex items-center justify-center p-4">
              <div className="bg-[#141418] border border-white/20 rounded-3xl p-8 max-w-md w-full space-y-5 shadow-glass animate-scale-in">
                <div className="flex justify-center"><MotionOwlEyes size="lg" /></div>
                <h2 className="font-serif text-2xl text-white text-center font-medium">Welcome to OWL</h2>
                <p className="text-sm text-gray-300 text-center">Your premium AI workspace & interactive Code Canva Studio.</p>
                <div className="space-y-2">
                  <button onClick={() => { localStorage.setItem('owl_onboarded', 'true'); setOnboardingOpen(false); navigateTo('settings'); }} className="w-full py-2 bg-brand-gold hover:bg-brand-goldHover text-black font-semibold rounded-xl">Configure API Key</button>
                  <button onClick={() => { localStorage.setItem('owl_onboarded', 'true'); setOnboardingOpen(false); }} className="w-full py-2 bg-white/5 hover:bg-white/10 text-white font-semibold rounded-xl">Explore First</button>
                </div>
              </div>
            </div>
          )}

          {readmeOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-xl flex items-center justify-center p-4" onClick={() => setReadmeOpen(false)}>
              <div className="bg-[#141418] border border-white/20 rounded-3xl p-8 max-w-2xl w-full max-h-[80vh] overflow-y-auto custom-scrollbar shadow-glass animate-scale-in" onClick={e => e.stopPropagation()}>
                <div className="flex justify-between items-center mb-4"><h2 className="font-serif text-2xl text-white">OWL Workspace Architecture</h2><button onClick={() => setReadmeOpen(false)} className="text-gray-400 hover:text-white"><Icon name="close" className="w-5 h-5" /></button></div>
                <div className="prose-owl text-sm text-gray-300">
                  <p>OWL is a client-side AI engineering workspace with direct OpenRouter streaming and interactive code sandboxes.</p>
                  <h3>Key Capabilities</h3>
                  <ul>
                    <li><strong>⚡ Code Canva Studio:</strong> Inspect, run live previews, and toggle Desktop/Tablet/Mobile viewports.</li>
                    <li><strong>⚡ Codes Gallery:</strong> Every code block in your chat history is indexed into flashcards with quick deletion.</li>
                    <li><strong>⚡ In-Chat Search:</strong> Scan and highlight keywords across active conversations in real-time.</li>
                    <li><strong>⚡ Prompt Management:</strong> Save, use, and edit prompts directly in the library.</li>
                  </ul>
                </div>
              </div>
            </div>
          )}

          {/* Toast */}
          {toastMessage && (
            <div className="fixed bottom-5 right-5 z-50 bg-[#18181c] border border-brand-gold/40 text-white px-4 py-2.5 rounded-xl shadow-glass text-xs flex items-center gap-2.5 animate-fade-in-up">
              <MotionOwlEyes size="sm" />
              <span>{toastMessage}</span>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
   </html>
