          <div style="font-size:12px;color:var(--text-3);margin-top:2px">${p.authMethod}</div>
        </div>
      </div>
      <div class="auth-steps">
        <div class="auth-step"><div class="auth-step-num">1</div><div>Tap continue — OWL opens ${p.name}'s official authentication endpoint in a new tab.</div></div>
        <div class="auth-step"><div class="auth-step-num">2</div><div>Sign up for a new account, or log in with your existing ${p.product} credentials directly on ${p.name}'s domain.</div></div>
        <div class="auth-step"><div class="auth-step-num">3</div><div>${p.name} securely redirects a session token back to OWL. You're returned here automatically.</div></div>
      </div>
      <div class="auth-note">
        <strong>Security:</strong> OWL does not capture passwords, scrape private data, intercept communications, or bypass any provider security mechanism. If a provider blocks direct integration, OWL falls back to its officially supported integration method.
      </div>
      <div style="display:flex;gap:10px;margin-top:20px">
        <button class="btn btn-ghost" id="obBack2">Back</button>
        <button class="btn btn-primary" id="obAuth" style="flex:1">Continue to ${p.name}</button>
      </div>
    `;
    $('#obBack2').addEventListener('click', () => { this.step = 1; this.render(); });
    $('#obAuth').addEventListener('click', () => this.doAuth(p));
  },
  
  async doAuth(p){
    const panel = $('#authPanel');
    panel.innerHTML = `
      <div class="auth-progress">
        <div class="auth-spinner"></div>
        <div class="auth-progress-text" id="authText">Opening ${p.name} official website...</div>
      </div>
    `;
    const text = $('#authText');
    const steps = [
      `Opening ${p.name} official website...`,
      `Please sign up or log in on ${p.product}'s domain...`,
      `Waiting for secure session token...`,
      `Token received. Connecting to OWL...`
    ];
    for (let i = 0; i < steps.length; i++){
      text.textContent = steps[i];
      await new Promise(r => setTimeout(r, 800));
    }
    
    // Use the adapter — abstract integration
    const AdapterClass = Adapters.demo;
    currentAdapter = new AdapterClass(p);
    const result = await currentAdapter.authenticate();
    
    if (result.ok){
      Store.data.provider = p.id;
      Store.data.model = p.models[0].id;
      Store.save();
      this.step = 3;
      this.render();
    }
  },
  
  renderConnected(body){
    const p = PROVIDERS[Store.data.provider];
    const model = p.models.find(m => m.id === Store.data.model) || p.models[0];
    body.innerHTML = `
      <div class="ob-content">
        <div class="ob-eyebrow">Step 4 · Connection confirmed</div>
        <h1 class="ob-title">You're connected.</h1>
        <p class="ob-subtitle">${p.name} is ready. OWL will route your conversations through ${model.name} — switch models any time from the workspace.</p>
        <div class="connection-confirmed">
          <div class="confirm-badge">${ICON.check}</div>
          <div style="font-size:13px;color:var(--text-2)">${p.name} · ${model.name}</div>
        </div>
        <div class="ob-actions">
          <button class="btn btn-primary btn-lg" id="obEnter">Enter OWL</button>
        </div>
      </div>
    `;
    $('#obEnter').addEventListener('click', () => {
      Store.data.onboarded = true;
      Store.save();
      $('#onboarding').classList.add('hidden');
      $('#app').classList.remove('hidden');
      App.init();
    });
  }
};

/* ---------- App ---------- */
const App = {
  init(){
    this.detectMobile();
    this.renderSidebar();
    this.renderBottomNav();
    this.bindGlobal();
    this.bindComposer();
    Router.go('home');
    if (window.matchMedia('(max-width: 900px)').matches){
      document.body.classList.add('mobile');
      $('#app').classList.add('mobile');
    }
    // Set provider color CSS vars
    if (Store.data.provider){
      const p = PROVIDERS[Store.data.provider];
      document.documentElement.style.setProperty('--provider-color', p.color);
    }
  },
  
  detectMobile(){
    const mq = window.matchMedia('(max-width: 900px)');
    const apply = (e) => {
      if (e.matches){
        $('#app').classList.add('mobile');
      } else {
        $('#app').classList.remove('mobile');
        State.sidebarOpen = false;
      }
    };
    mq.addEventListener('change', apply);
    apply(mq);
  },
  
  renderSidebar(){
    const nav = $('#sbNav');
    const items = [
      {id:'home', label:'Home', icon:ICON.home},
      {id:'chats', label:'Chats', icon:ICON.chats, count: Store.data.conversations.length},
      {id:'projects', label:'Projects', icon:ICON.projects, count: Store.data.projects.length},
      {id:'models', label:'Models', icon:ICON.models},
      {id:'files', label:'Files', icon:ICON.files, count: Store.data.files.length},
      {id:'settings', label:'Settings', icon:ICON.settings},
    ];
    nav.innerHTML = items.map(it => `
      <div class="sb-nav-item ${State.currentView === it.id ? 'active':''}" data-view="${it.id}">
        ${it.icon}
        <span>${it.label}</span>
        ${typeof it.count !== 'undefined' ? `<span class="count">${it.count}</span>` : ''}
      </div>
    `).join('');
    $$('.sb-nav-item', nav).forEach(el => {
      el.addEventListener('click', () => {
        Router.go(el.dataset.view);
        if ($('#app').classList.contains('mobile')){
          App.toggleSidebar(false);
        }
      });
    });
    this.renderRecent();
    this.renderFooter();
  },
  
  renderRecent(){
    const list = $('#sbRecent');
    const convs = Store.data.conversations.slice(0, 12);
    if (!convs.length){
      list.innerHTML = `<div style="padding:14px 10px;font-size:12px;color:var(--text-4);text-align:center">No conversations yet</div>`;
      return;
    }
    list.innerHTML = convs.map(c => {
      const p = PROVIDERS[c.provider];
      const last = c.messages[c.messages.length-1];
      const preview = last ? last.content.slice(0, 50) : 'New conversation';
      return `
        <div class="recent-item ${State.currentConvId === c.id ? 'active':''}" data-id="${c.id}" style="--provider-color:${p.color}">
          <div class="ri-title">${escapeHtml(c.title || 'New conversation')}</div>
          <div class="ri-meta">
            <span class="ri-dot"></span>
            <span>${escapeHtml(preview)}</span>
            <span style="margin-left:auto">${fmtTime(c.updated)}</span>
          </div>
          <button class="ri-del" data-id="${c.id}" title="Delete">${ICON.trash}</button>
        </div>
      `;
    }).join('');
    $$('.recent-item', list).forEach(el => {
      el.addEventListener('click', e => {
        if (e.target.closest('.ri-del')) return;
        Router.openConversation(el.dataset.id);
      });
    });
    $$('.ri-del', list).forEach(el => {
      el.addEventListener('click', e => {
        e.stopPropagation();
        Router.deleteConversation(el.dataset.id);
      });
    });
  },
  
  renderFooter(){
    const footer = $('#sbFooter');
    if (!Store.data.provider){
      footer.innerHTML = `<div style="padding:10px 8px;font-size:12px;color:var(--text-4)">No provider connected</div>`;
      return;
    }
    const p = PROVIDERS[Store.data.provider];
    const m = p.models.find(x => x.id === Store.data.model) || p.models[0];
    footer.innerHTML = `
      <div class="sb-provider" id="sbProvider" style="--provider-color:${p.color}">
        <div class="sb-provider-avatar">${p.glyph}</div>
        <div class="sb-provider-info">
          <div class="sb-provider-name">${p.name}</div>
          <div class="sb-provider-model">${m.name}</div>
        </div>
      </div>
    `;
    $('#sbProvider').addEventListener('click', () => Router.go('models'));
  },
  
  renderBottomNav(){
    const nav = $('#bottomNav');
    const items = [
      {id:'home', label:'Home', icon:ICON.home},
      {id:'chats', label:'Chats', icon:ICON.chats},
      {id:'projects', label:'Projects', icon:ICON.projects},
      {id:'models', label:'Models', icon:ICON.models},
      {id:'settings', label:'Settings', icon:ICON.settings},
    ];
    nav.innerHTML = items.map(it => `
      <button class="bn-item ${State.currentView === it.id ? 'active':''}" data-view="${it.id}">
        ${it.icon}
        <span>${it.label}</span>
      </button>
    `).join('');
    $$('.bn-item', nav).forEach(el => {
      el.addEventListener('click', () => Router.go(el.dataset.view));
    });
  },
  
  toggleSidebar(open){
    State.sidebarOpen = typeof open === 'boolean' ? open : !State.sidebarOpen;
    $('#app').classList.toggle('sidebar-open', State.sidebarOpen);
    $('#sbOverlay').classList.toggle('open', State.sidebarOpen);
  },
  
  bindGlobal(){
    $('#sbCollapse').addEventListener('click', () => {
      $('#app').classList.toggle('no-sidebar');
    });
    $('#tbMenu').addEventListener('click', () => this.toggleSidebar());
    $('#sbOverlay').addEventListener('click', () => this.toggleSidebar(false));
    $('#sbNew').addEventListener('click', () => Router.newConversation());
    $('#tbModelPill').addEventListener('click', () => Router.go('models'));
    $('#tbSearch').addEventListener('click', () => Search.open());
    $('#tbShare').addEventListener('click', () => this.shareCurrent());
    $('#sbSearch').addEventListener('input', debounce(e => this.searchRecent(e.target.value), 200));
    
    document.addEventListener('keydown', e => {
      const mod = e.metaKey || e.ctrlKey;
      if (mod && e.key === 'k'){ e.preventDefault(); Search.open(); }
      else if (mod && e.key === 'n'){ e.preventDefault(); Router.newConversation(); }
      else if (mod && e.key === 'b'){ e.preventDefault(); this.toggleSidebar(); }
      else if (mod && e.key === '/'){ e.preventDefault(); $('#composerInput').focus(); }
      else if (e.key === 'Escape'){
        if ($('#modalRoot').children.length){
          $('#modalRoot').innerHTML = '';
        } else if (State.sidebarOpen){
          this.toggleSidebar(false);
        }
      }
    });
  },
  
  searchRecent(q){
    const list = $('#sbRecent');
    if (!q){
      this.renderRecent();
      return;
    }
    const lower = q.toLowerCase();
    const results = Store.data.conversations.filter(c => {
      if (c.title.toLowerCase().includes(lower)) return true;
      return c.messages.some(m => m.content.toLowerCase().includes(lower));
    }).slice(0, 12);
    if (!results.length){
      list.innerHTML = `<div style="padding:14px 10px;font-size:12px;color:var(--text-4);text-align:center">No matches</div>`;
      return;
    }
    list.innerHTML = results.map(c => {
      const p = PROVIDERS[c.provider];
      return `
        <div class="recent-item ${State.currentConvId === c.id ? 'active':''}" data-id="${c.id}" style="--provider-color:${p.color}">
          <div class="ri-title">${escapeHtml(c.title || 'New conversation')}</div>
          <div class="ri-meta"><span class="ri-dot"></span><span>${fmtTime(c.updated)}</span></div>
        </div>
      `;
    }).join('');
    $$('.recent-item', list).forEach(el => {
      el.addEventListener('click', () => Router.openConversation(el.dataset.id));
    });
  },
  
  shareCurrent(){
    if (!State.currentConvId){
      Toast.show('Open a conversation to share', 'info');
      return;
    }
    const conv = Store.data.conversations.find(c => c.id === State.currentConvId);
    if (!conv) return;
    const text = conv.messages.map(m => `**${m.role === 'user' ? 'You' : 'AI'}:** ${m.content}`).join('\n\n');
    navigator.clipboard.writeText(text).then(() => {
      Toast.show('Conversation copied as Markdown', 'success');
    }).catch(() => {
      Toast.show('Could not copy', 'error');
    });
  },
  
  bindComposer(){
    const input = $('#composerInput');
    const send = $('#composerSend');
    const plus = $('#composerPlus');
    const menu = $('#composerAttachMenu');
    
    // Auto-resize
    const resize = () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 200) + 'px';
    };
    input.addEventListener('input', () => {
      resize();
      const hasText = input.textContent.trim().length > 0;
      send.disabled = !hasText && !State.attachments.length;
      send.classList.toggle('stop', State.streaming);
    });
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey && Store.data.settings.sendOnEnter){
        e.preventDefault();
        if (State.streaming){
          State.stopStream = true;
        } else {
          this.sendMessage();
        }
      }
    });
    send.addEventListener('click', () => {
      if (State.streaming){
        State.stopStream = true;
      } else {
        this.sendMessage();
      }
    });
    
    // Attach menu
    plus.addEventListener('click', e => {
      e.stopPropagation();
      menu.classList.toggle('open');
    });
    document.addEventListener('click', e => {
      if (!menu.contains(e.target) && e.target !== plus){
        menu.classList.remove('open');
      }
    });
    $$('.attach-menu-item', menu).forEach(item => {
      item.addEventListener('click', () => {
        this.addAttachment(item.dataset.attach);
        menu.classList.remove('open');
      });
    });
    
    // Placeholder behavior for contenteditable
    const updatePlaceholder = () => {
      if (!input.textContent.trim()){
        input.setAttribute('data-empty', 'true');
      } else {
        input.removeAttribute('data-empty');
      }
    };
    input.addEventListener('input', updatePlaceholder);
    updatePlaceholder();
    
    // Apply placeholder via CSS
    const style = document.createElement('style');
    style.textContent = `.composer-input[data-empty="true"]::before { content: attr(data-placeholder); color: var(--text-4); pointer-events: none; }`;
    document.head.appendChild(style);
  },
  
  addAttachment(type){
    const types = {
      file: { icon: ICON.file, name: 'document.pdf', size: '1.2 MB' },
      image: { icon: ICON.image, name: 'screenshot.png', size: '340 KB' },
      note: { icon: ICON.edit, name: 'inline-note.md', size: '0.4 KB' },
    };
    const t = types[type];
    if (!t) return;
    State.attachments.push({ id: uid(), type, ...t });
    this.renderAttachments();
    Toast.show(`${t.name} attached`, 'success');
  },
  
  renderAttachments(){
    const wrap = $('#composerAttachments');
    if (!State.attachments.length){
      wrap.style.display = 'none';
      $('#composer').classList.remove('attachments-present');
      return;
    }
    wrap.style.display = 'flex';
    $('#composer').classList.add('attachments-present');
    wrap.innerHTML = State.attachments.map(a => `
      <div class="composer-attach" data-id="${a.id}">
        ${a.icon}
        <span>${escapeHtml(a.name)}</span>
        <span style="color:var(--text-4);font-size:10.5px">${a.size}</span>
        <span class="ca-remove" data-id="${a.id}">${ICON.close}</span>
      </div>
    `).join('');
    $$('.ca-remove', wrap).forEach(el => {
      el.addEventListener('click', () => {
        State.attachments = State.attachments.filter(a => a.id !== el.dataset.id);
        this.renderAttachments();
        $('#composerSend').disabled = !$('#composerInput').textContent.trim() && !State.attachments.length;
      });
    });
  },
  
  async sendMessage(){
    const input = $('#composerInput');
    const text = input.textContent.trim();
    if (!text && !State.attachments.length) return;
    
    // Ensure conversation exists
    let conv = State.currentConvId ? Store.data.conversations.find(c => c.id === State.currentConvId) : null;
    if (!conv){
      conv = Router.createConversation();
    }
    
    // Add user message
    const userMsg = {
      id: uid(),
      role: 'user',
      content: text,
      attachments: State.attachments.slice(),
      ts: Date.now(),
    };
    conv.messages.push(userMsg);
    conv.title = conv.messages.length === 1 ? text.slice(0, 50) : conv.title;
    conv.updated = Date.now();
    Store.save();
    
    // Clear input
    input.textContent = '';
    input.style.height = 'auto';
    input.removeAttribute('data-empty');
    State.attachments = [];
    this.renderAttachments();
    $('#composerSend').disabled = true;
    
    // Re-render messages
    ChatView.renderMessages();
    App.renderRecent();
    
    // Stream response
    await this.streamResponse(conv);
  },
  
  async streamResponse(conv){
    const p = PROVIDERS[conv.provider];
    const model = p.models.find(m => m.id === conv.model) || p.models[0];
    
    // Add placeholder AI message
    const aiMsg = {
      id: uid(),
      role: 'assistant',
      content: '',
      model: model.name,
      provider: conv.provider,
      ts: Date.now(),
      streaming: true,
    };
    conv.messages.push(aiMsg);
    ChatView.renderMessages();
    
    State.streaming = true;
    State.stopStream = false;
    $('#composerSend').disabled = false;
    $('#composerSend').classList.add('stop');
    $('#composerSend').innerHTML = ICON.stop;
    
    try {
      const history = conv.messages.slice(0, -1);
      const lastUser = history.filter(m => m.role === 'user').slice(-1)[0];
      
      if (currentAdapter){
        currentAdapter._stop = false;
        for await (const token of currentAdapter.stream(lastUser.content, history, model)){
          if (State.stopStream){
            currentAdapter.stop();
            break;
          }
          aiMsg.content += token;
          ChatView.updateStreamingMessage(aiMsg);
        }
      } else {
        // Fallback
        aiMsg.content = pickDemoResponse(lastUser.content);
        ChatView.updateStreamingMessage(aiMsg);
      }
      
      aiMsg.streaming = false;
      conv.updated = Date.now();
      Store.save();
      ChatView.renderMessages();
    } catch(e){
      console.error(e);
      aiMsg.content += '\n\n*Stream interrupted.*';
      aiMsg.streaming = false;
      Store.save();
      ChatView.renderMessages();
      Toast.show('Stream error', 'error');
    }
    
    State.streaming = false;
    State.stopStream = false;
    $('#composerSend').classList.remove('stop');
    $('#composerSend').innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
    $('#composerSend').disabled = !$('#composerInput').textContent.trim();
    App.renderRecent();
  }
};

/* ---------- Router ---------- */
const Router = {
  go(view, params){
    State.currentView = view;
    State.currentProjectId = params && params.projectId;
    
    // Update nav
    $$('.sb-nav-item').forEach(el => el.classList.toggle('active', el.dataset.view === view));
    $$('.bn-item').forEach(el => el.classList.toggle('active', el.dataset.view === view));
    
    // Render view
    const content = $('#wsContent');
    const breadcrumb = $('#tbBreadcrumb');
    
    if (view === 'home') HomeView.render(content, breadcrumb);
    else if (view === 'chats') ChatsView.render(content, breadcrumb);
    else if (view === 'projects') ProjectsView.render(content, breadcrumb);
    else if (view === 'models') ModelsView.render(content, breadcrumb);
    else if (view === 'files') FilesView.render(content, breadcrumb);
    else if (view === 'settings') SettingsView.render(content, breadcrumb);
    
    content.scrollTop = 0;
  },
  
  createConversation(){
    const p = PROVIDERS[Store.data.provider];
    const conv = {
      id: uid(),
      title: 'New conversation',
      provider: Store.data.provider,
      model: Store.data.model,
      messages: [],
      created: Date.now(),
      updated: Date.now(),
      projectId: State.currentProjectId,
    };
    Store.data.conversations.unshift(conv);
    Store.save();
    State.currentConvId = conv.id;
    App.renderRecent();
    return conv;
  },
  
  newConversation(){
    State.currentConvId = null;
    Router.go('home');
    setTimeout(() => $('#composerInput').focus(), 50);
  },
  
  openConversation(id){
    const conv = Store.data.conversations.find(c => c.id === id);
    if (!conv) return;
    State.currentConvId = id;
    State.currentView = 'chat';
    $$('.sb-nav-item').forEach(el => el.classList.remove('active'));
    $$('.bn-item').forEach(el => el.classList.remove('active'));
    
    const content = $('#wsContent');
    const breadcrumb = $('#tbBreadcrumb');
    breadcrumb.innerHTML = `<span>Conversations</span>${ICON.chevron}<span>${escapeHtml(conv.title)}</span>`;
    content.innerHTML = '';
    ChatView.mount(content, conv);
  },
  
  deleteConversation(id){
    Modal.confirm({
      title: 'Delete conversation?',
      message: 'This conversation and its messages will be permanently removed. This cannot be undone.',
      confirmLabel: 'Delete',
      danger: true
    }).then(ok => {
      if (!ok) return;
      Store.data.conversations = Store.data.conversations.filter(c => c.id !== id);
      Store.save();
      if (State.currentConvId === id){
        State.currentConvId = null;
        Router.go('home');
      }
      App.renderRecent();
      Toast.show('Conversation deleted', 'success');
    });
  }
};

/* ---------- ChatView ---------- */
const ChatView = {
  mount(container, conv){
    this.currentConv = conv;
    this.renderMessages();
  },
  
  renderMessages(){
    const content = $('#wsContent');
    const conv = this.currentConv;
    if (!conv) return;
    
    if (!conv.messages.length){
      content.innerHTML = `
        <div class="chat-view">
          <div class="chat-empty">
            <div class="chat-empty-icon">
              <div class="splash-eye"></div>
              <div class="splash-eye"></div>
            </div>
            <h1>What would you like to <em>explore</em>?</h1>
            <p>Start a conversation with ${PROVIDERS[conv.provider].name} · ${PROVIDERS[conv.provider].models[0].name}.</p>
            <div class="chat-suggestions">
              <div class="suggestion" data-prompt="Explain how neural networks learn, in plain language.">
                <div class="suggestion-title">Explain a concept</div>
                <div class="suggestion-desc">How neural networks learn, in plain language</div>
              </div>
              <div class="suggestion" data-prompt="Write a debounce function in JavaScript with comments.">
                <div class="suggestion-title">Write some code</div>
                <div class="suggestion-desc">A clean debounce function with comments</div>
              </div>
              <div class="suggestion" data-prompt="Compare REST and GraphQL — when does each make sense?">
                <div class="suggestion-title">Compare options</div>
                <div class="suggestion-desc">REST vs GraphQL — tradeoffs and use cases</div>
              </div>
              <div class="suggestion" data-prompt="Draft a friendly follow-up email after a meeting.">
                <div class="suggestion-title">Draft writing</div>
                <div class="suggestion-desc">A meeting follow-up email</div>
              </div>
            </div>
          </div>
        </div>
      `;
      $$('.suggestion').forEach(s => {
        s.addEventListener('click', () => {
          $('#composerInput').textContent = s.dataset.prompt;
          $('#composerInput').dispatchEvent(new Event('input'));
          App.sendMessage();
        });
      });
      return;
    }
    
    const p = PROVIDERS[conv.provider];
    
    content.innerHTML = `<div class="chat-view"><div class="messages" id="messagesRoot"></div></div>`;
    const root = $('#messagesRoot');
    
    conv.messages.forEach(msg => {
      root.appendChild(this.buildMessageEl(msg, p));
    });
    
    // Apply syntax highlighting
    $$('pre code', root).forEach(b => {
      try { hljs.highlightElement(b); } catch(e){}
    });
    
    // Bind code copy buttons
    $$('.code-copy', root).forEach(b => {
      b.addEventListener('click', () => {
        const code = b.closest('pre').querySelector('code');
        navigator.clipboard.writeText(code.textContent);
        b.innerHTML = `${ICON.check}<span>Copied</span>`;
        setTimeout(() => b.innerHTML = `${ICON.copy}<span>Copy</span>`, 1500);
      });
    });
    
    // Bind message actions
    $$('.msg-action').forEach(a => {
      a.addEventListener('click', () => this.handleAction(a.dataset.action, a.dataset.msgId));
    });
    
    // Scroll to bottom
    content.scrollTop = content.scrollHeight;
  },
  
  buildMessageEl(msg, provider){
    const el = document.createElement('div');
    el.className = 'msg';
    el.dataset.msgId = msg.id;
    
    if (msg.role === 'user'){
      const attachHtml = msg.attachments && msg.attachments.length ? `
        <div class="msg-attachments">
          ${msg.attachments.map(a => `<div class="msg-attach">${a.icon}<span>${escapeHtml(a.name)}</span></div>`).join('')}
        </div>
      ` : '';
      el.innerHTML = `
        <div class="msg-head">
          <div class="msg-avatar user">YO</div>
          <span class="msg-author">You</span>
          <span class="msg-meta"><span class="sep">·</span>${fmtClock(msg.ts)}</span>
        </div>
        ${attachHtml}
        <div class="msg-body user-body">${escapeHtml(msg.content)}</div>
        <div class="msg-actions">
          <button class="msg-action" data-action="copy" data-msg-id="${msg.id}">${ICON.copy}<span>Copy</span></button>
          <button class="msg-action" data-action="edit" data-msg-id="${msg.id}">${ICON.edit}<span>Edit</span></button>
        </div>
      `;
    } else {
      const providerColor = provider.color;
      const content = msg.streaming ? msg.content + '<span class="streaming-cursor"></span>' : msg.content;
      const html = msg.content ? Md.render(content) : '<span class="streaming-cursor"></span>';
      el.innerHTML = `
        <div class="msg-head">
          <div class="msg-avatar ai" style="background:${providerColor}">${provider.glyph}</div>
          <span class="msg-author">${provider.product}</span>
          <span class="msg-meta">
            <span class="sep">·</span>
            <span class="provider-tag" style="--provider-color:${providerColor}"><span class="dot"></span>${msg.model || provider.models[0].name}</span>
            <span class="sep">·</span>${fmtClock(msg.ts)}
          </span>
        </div>
        <div class="msg-body">${html}</div>
        ${!msg.streaming ? `
          <div class="msg-actions">
            <button class="msg-action" data-action="copy" data-msg-id="${msg.id}">${ICON.copy}<span>Copy</span></button>
            <button class="msg-action" data-action="regenerate" data-msg-id="${msg.id}">${ICON.refresh}<span>Regenerate</span></button>
            <button class="msg-action" data-action="continue" data-msg-id="${msg.id}">${ICON.arrowRight}<span>Continue</span></button>
            <button class="msg-action" data-action="save" data-msg-id="${msg.id}">${ICON.bookmark}<span>Save</span></button>
            <button class="msg-action" data-action="share" data-msg-id="${msg.id}">${ICON.share}<span>Share</span></button>
          </div>
        ` : ''}
      `;
    }
    return el;
  },
  
  updateStreamingMessage(msg){
    const el = $(`[data-msg-id="${msg.id}"]`);
    if (!el) return;
    const body = $('.msg-body', el);
    body.innerHTML = Md.render(msg.content + '<span class="streaming-cursor"></span>');
    $('#wsContent').scrollTop = $('#wsContent').scrollHeight;
  },
  
  handleAction(action, msgId){
    const conv = this.currentConv;
    if (!conv) return;
    const msg = conv.messages.find(m => m.id === msgId);
    if (!msg) return;
    
    if (action === 'copy'){
      navigator.clipboard.writeText(msg.content).then(() => Toast.show('Copied to clipboard', 'success'));
    } else if (action === 'regenerate'){
      this.regenerate(msgId);
    } else if (action === 'continue'){
      this.continueMsg(msgId);
    } else if (action === 'save'){
      Store.data.saved.push({ id: uid(), msgId, convId: conv.id, content: msg.content, ts: Date.now() });
      Store.save();
      Toast.show('Saved to bookmarks', 'success');
    } else if (action === 'share'){
      navigator.clipboard.writeText(msg.content).then(() => Toast.show('Message copied to share', 'success'));
    } else if (action === 'edit'){
      const input = $('#composerInput');
      input.textContent = msg.content;
      input.dispatchEvent(new Event('input'));
      input.focus();
    }
  },
  
  async regenerate(msgId){
    const conv = this.currentConv;
    const idx = conv.messages.findIndex(m => m.id === msgId);
    if (idx < 0) return;
    // Remove this message and re-stream
    conv.messages.splice(idx, 1);
    Store.save();
    this.renderMessages();
    await App.streamResponse(conv);
  },
  
  async continueMsg(msgId){
    const conv = this.currentConv;
    const msg = conv.messages.find(m => m.id === msgId);
    if (!msg) return;
    // Append a continuation prompt
    conv.messages.push({
      id: uid(), role: 'user', content: 'Continue', ts: Date.now(), hidden: true
    });
    await App.streamResponse(conv);
  }
};

        ${files.length ? `
          <div class="files-grid">
            ${files.map(f => {
              const icon = f.type === 'image' ? ICON.image : f.type === 'code' ? ICON.code : ICON.file;
              return `
                <div class="file-card" data-id="${f.id}">

        `}
      </div>

  triggerUpload(){
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.multiple = true;
    inp.addEventListener('change', () => this.handleFiles(inp.files));
    inp.click();
  },
  
  handleFiles(fileList){
    const types = {
      'image/': 'image',
      'text/': 'text',
      'application/pdf': 'text',
      'application/json': 'code',
      'javascript': 'code',
      'python': 'code',
      'typescript': 'code',
    };
    Array.from(fileList).forEach(f => {
      let type = 'text';
      for (const k in types){
        if (f.type.includes(k) || f.name.match(/\.(js|ts|py|go|rs|java|c|cpp|css|html|json)$/)){
          type = types[k]; break;
        }
      }
      if (f.type.startsWith('image/')) type = 'image';
      Store.data.files.push({
        id: uid(),
        name: f.name,
        size: f.size,
        type,
        added: Date.now(),
      });
    });
    Store.save();
    this.render($('#wsContent'), $('#tbBreadcrumb'));
    App.renderSidebar();
    Toast.show(`${fileList.length} file${fileList.length === 1 ? '' : 's'} added`, 'success');
  }
};

/* ---------- Search ---------- */
const Search = {
  highlighted: 0,
  results: [],
  
  open(){
    const root = $('#modalRoot');
    root.innerHTML = '';
    const back = document.createElement('div');
    back.className = 'modal-backdrop';
    back.innerHTML = `
      <div class="modal search-modal" role="dialog">
        <div class="search-input-wrap">
          <input type="text" id="searchInput" placeholder="Search conversations and messages..." autocomplete="off" />
        </div>
        <div class="search-results" id="searchResults">
          <div class="search-empty">Start typing to search across all your conversations.</div>
        </div>
      </div>
    `;
    root.appendChild(back);
    back.addEventListener('click', e => { if (e.target === back) root.innerHTML = ''; });
    
    const input = $('#searchInput', back);
    input.focus();
    
    const doSearch = debounce(q => this.search(q), 150);
    input.addEventListener('input', e => doSearch(e.target.value));
    input.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown'){ e.preventDefault(); this.moveHighlight(1); }
      else if (e.key === 'ArrowUp'){ e.preventDefault(); this.moveHighlight(-1); }
      else if (e.key === 'Enter'){ e.preventDefault(); this.openHighlighted(); }
      else if (e.key === 'Escape'){ root.innerHTML = ''; }
    });
  },
  
  search(q){
    const results = $('#searchResults');
    if (!q || q.length < 2){
      results.innerHTML = `<div class="search-empty">Start typing to search across all your conversations.</div>`;
      this.results = [];
      return;
    }
    const lower = q.toLowerCase();
    const matches = [];
    Store.data.conversations.forEach(c => {
      if (c.title.toLowerCase().includes(lower)){
        matches.push({ conv: c, snippet: c.title, isTitle: true });
      }
      c.messages.forEach(m => {
        const idx = m.content.toLowerCase().indexOf(lower);
        if (idx >= 0){
          const start = Math.max(0, idx - 40);
          const end = Math.min(m.content.length, idx + q.length + 40);
          matches.push({ conv: c, snippet: (start > 0 ? '...' : '') + m.content.slice(start, end) + (end < m.content.length ? '...' : '') });
        }
      });
    });
    
    this.results = matches.slice(0, 12);
    this.highlighted = 0;
    
    if (!this.results.length){
      results.innerHTML = `<div class="search-empty">No matches for "${escapeHtml(q)}"</div>`;
      return;
    }
    
    results.innerHTML = this.results.map((r, i) => {
      const p = PROVIDERS[r.conv.provider];
      return `
        <div class="search-result ${i === 0 ? 'highlighted' : ''}" data-i="${i}" style="--provider-color:${p.color}">
          <span class="sr-dot"></span>
          <div class="sr-text">
            <div class="sr-title">${escapeHtml(r.conv.title)}</div>
            <div class="sr-snippet">${escapeHtml(r.snippet)}</div>
          </div>
          <span class="sr-time">${fmtTime(r.conv.updated)}</span>
        </div>
      `;
    }).join('');
    
    $$('.search-result', results).forEach(el => {
      el.addEventListener('click', () => {
        const r = this.results[parseInt(el.dataset.i)];
        $('#modalRoot').innerHTML = '';
        Router.openConversation(r.conv.id);
      });
    });
  },
  
  moveHighlight(delta){
    if (!this.results.length) return;
    this.highlighted = (this.highlighted + delta + this.results.length) % this.results.length;
    $$('.search-result').forEach((el, i) => el.classList.toggle('highlighted', i === this.highlighted));
    const highlighted = $$('.search-result')[this.highlighted];
    if (highlighted) highlighted.scrollIntoView({block:'nearest'});
  },
  
  openHighlighted(){
    if (!this.results.length) return;
    const r = this.results[this.highlighted];
    $('#modalRoot').innerHTML = '';
    Router.openConversation(r.conv.id);
  }
};

/* ---------- PWA ---------- */
function setupPWA(){
  const manifest = {
    name: 'OWL — AI Workspace',
    short_name: 'OWL',
    description: 'One environment for every AI model. A premium AI workspace interface layer.',
    start_url: '.',
    display: 'standalone',
    background_color: '#0c0a09',
    theme_color: '#0c0a09',
    orientation: 'any',
    icons: [
      {
        src: 'data:image/svg+xml;base64,' + btoa(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect width="192" height="192" rx="36" fill="#0c0a09"/><ellipse cx="76" cy="84" rx="14" ry="17" fill="none" stroke="#e8b04b" stroke-width="2.5"/><ellipse cx="116" cy="84" rx="14" ry="17" fill="none" stroke="#e8b04b" stroke-width="2.5"/><circle cx="76" cy="84" r="4" fill="#e8b04b"/><circle cx="116" cy="84" r="4" fill="#e8b04b"/><path d="M96 100 L92 108 L100 108 Z" fill="#e8b04b"/></svg>`),
        sizes: '192x192',
        type: 'image/svg+xml',
        purpose: 'any maskable'
      },
      {
        src: 'data:image/svg+xml;base64,' + btoa(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="#0c0a09"/><ellipse cx="200" cy="220" rx="38" ry="46" fill="none" stroke="#e8b04b" stroke-width="7"/><ellipse cx="312" cy="220" rx="38" ry="46" fill="none" stroke="#e8b04b" stroke-width="7"/><circle cx="200" cy="220" r="11" fill="#e8b04b"/><circle cx="312" cy="220" r="11" fill="#e8b04b"/><path d="M256 268 L246 290 L266 290 Z" fill="#e8b04b"/></svg>`),
        sizes: '512x512',
        type: 'image/svg+xml',
        purpose: 'any maskable'
      }
    ]
  };
  const blob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = URL.createObjectURL(blob);
  document.head.appendChild(link);
  
  // Register service worker via data URL (offline shell, no caching of remote content)
  if ('serviceWorker' in navigator){
    const swCode = `
      const CACHE = 'owl-v1';
      self.addEventListener('install', e => { self.skipWaiting(); });
      self.addEventListener('activate', e => { e.waitUntil(self.clients.claim()); });
      self.addEventListener('fetch', e => {
        if (e.request.method !== 'GET') return;
        e.respondWith(
          fetch(e.request).catch(() => caches.match(e.request))
        );
      });
    `;
    const swBlob = new Blob([swCode], {type:'application/javascript'});
    const swUrl = URL.createObjectURL(swBlob);
    navigator.serviceWorker.register(swUrl).catch(() => {/* SW optional */});
  }
}

/* ---------- Init ---------- */
function init(){
  Store.load();
  setupPWA();
  
  // Apply font size setting
  if (Store.data.settings.fontSize){
    const sz = Store.data.settings.fontSize;
    document.documentElement.style.fontSize = sz === 'compact' ? '13px' : sz === 'spacious' ? '15.5px' : '14px';
  }
  if (Store.data.settings.reduceMotion){
    document.documentElement.classList.add('reduce-motion');
  }
  
  if (!Store.data.onboarded || !Store.data.provider){
    Onboarding.start();
  } else {
    // Already onboarded — set up adapter and go straight to app
    const p = PROVIDERS[Store.data.provider];
    if (p){
      const AdapterClass = Adapters.demo;
      currentAdapter = new AdapterClass(p);
      document.documentElement.style.setProperty('--provider-color', p.color);
    }
    setTimeout(() => {
      $('#splash').classList.add('gone');
      setTimeout(() => {
        $('#splash').style.display = 'none';
        $('#app').classList.remove('hidden');
        App.init();
      }, 600);
    }, 1400);
  }
}

document.addEventListener('DOMContentLoaded', init);
